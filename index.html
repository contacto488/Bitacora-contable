// ===================== HELPERS DE FECHA / PERIODO / CALENDARIO =====================
function hoyStr(){ var d=new Date(); var off=d.getTimezoneOffset(); return new Date(d.getTime()-off*60000).toISOString().slice(0,10); }
function dosDig(n){ return (n<10?"0":"")+n; }
function horaActualHM(){ var d=new Date(); return dosDig(d.getHours())+":"+dosDig(d.getMinutes()); }
function horarioCfg(config){ var h=(config&&config.horario)||{}; return {inicio:h.inicio||"08:00", fin:h.fin||"18:00"}; }
function dentroDeHorario(config){ var h=horarioCfg(config); var n=horaActualHM(); return n>=h.inicio && n<=h.fin; }
function hoyMes(){ return hoyStr().slice(0,7); }
function nombreMes(ym){ if(!ym) return ""; var p=ym.split("-"); var m=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"]; return m[parseInt(p[1],10)-1]+" "+p[0]; }
var MES_LARGO=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
// Fecha en que se debe hacer la actividad (para mostrar en la bitácora): desde los "Días" del mes visto, o desde la fecha límite.
function fechaRecordatorio(t, ym){
  if(!t) return "";
  var mo=+ym.slice(5,7);
  if(t.dias && t.dias.length){ return t.dias.map(function(d){ return d+" de "+MES_LARGO[mo-1]; }).join(" y "); }
  if(t.fechaLimite){ var p=String(t.fechaLimite).split("-"); if(p.length===3) return (+p[2])+" de "+MES_LARGO[(+p[1])-1]+" de "+p[0]; }
  return "";
}
function initials(n){ if(!n) return "?"; return n.split(" ").map(function(w){return w[0];}).join("").slice(0,2).toUpperCase(); }
function ultimoDia(ym){ var y=+ym.slice(0,4),m=+ym.slice(5,7); return new Date(y,m,0).getDate(); }
function mesesRecientes(n){ var arr=[]; var d=new Date(); for(var i=0;i<n;i++){ var dd=new Date(d.getFullYear(),d.getMonth()-i,1); arr.push(dd.toISOString().slice(0,7)); } return arr; }
// ----- Caché local acotada: guardar en el equipo solo los últimos N meses (la nube conserva todo) -----
function ymDeSlot(slot){ var m=/^(\d{4}-\d{2})(?:$|[-_])/.exec(String(slot||"")); return m?m[1]:null; } // diario/semanal/quincenal/mensual/ocasional -> YYYY-MM ; bimestral/semestral -> null (no se poda)
function podarRegistros(registros, nMeses){
  var keep={}; mesesRecientes(nMeses).forEach(function(m){keep[m]=1;});
  var out={};
  Object.keys(registros||{}).forEach(function(cid){
    var porFrec=registros[cid]||{}, o1={};
    Object.keys(porFrec).forEach(function(fk){
      var slots=porFrec[fk]||{}, o2={};
      Object.keys(slots).forEach(function(slot){ var ym=ymDeSlot(slot); if(ym===null || keep[ym]) o2[slot]=slots[slot]; });
      if(Object.keys(o2).length) o1[fk]=o2;
    });
    if(Object.keys(o1).length) out[cid]=o1;
  });
  return out;
}
function frecKey(frec){ return {"Diario":"diario","Semanal":"semanal","Quincenal":"quincenal","Mensual":"mensual","Bimestral":"bimestral","Semestral":"semestral","Ocasional":"ocasional"}[frec]||"otros"; }
function bimKey(ym){ var y=+ym.slice(0,4),m=+ym.slice(5,7); return y+"-B"+Math.ceil(m/2); }
function semKey(ym){ var y=+ym.slice(0,4),m=+ym.slice(5,7); return y+"-S"+(m<=6?1:2); }
function semanasDeMes(ym){ return Math.ceil(ultimoDia(ym)/7); }
// Ocurrencias (casillas) de una tarea en el mes: una por cada vez que se debe hacer.
function ocurrencias(frec, ym, cargoId, config){
  if(frec==="Diario"){
    var y=+ym.slice(0,4),m=+ym.slice(5,7),last=ultimoDia(ym),arr=[];
    for(var d=1; d<=last; d++){
      if(!esDiaLaboral(ym,d,config)) continue;
      var f=ym+"-"+(d<10?"0"+d:d);
      var au=ausenciaDe(cargoId,f,config);
      arr.push({key:f, label:d, hoy:f===hoyStr(), tipo: au?au.tipo:"normal"});
    }
    return arr;
  }
  if(frec==="Semanal"){ var a=[]; for(var i=1;i<=4;i++) a.push({key:ym+"_S"+i, label:"S"+i, tipo:"normal"}); return a; }
  if(frec==="Quincenal") return [{key:ym+"_Q1",label:"Q1"},{key:ym+"_Q2",label:"Q2"}];
  if(frec==="Bimestral") return [{key:bimKey(ym),label:"Bim"}];
  if(frec==="Semestral") return [{key:semKey(ym),label:"Sem"}];
  if(frec==="Ocasional") return [{key:ym,label:"Vez"}];
  return [{key:ym,label:"Mes"}]; // Mensual
}
// Clave de la ocurrencia "actual" según la fecha seleccionada (para valor/obs)
function slotActualKey(frec, fecha){
  var ym=fecha.slice(0,7), dia=+fecha.slice(8,10);
  if(frec==="Diario") return fecha;
  if(frec==="Semanal") return ym+"_S"+Math.min(4,Math.ceil(dia/7));
  if(frec==="Quincenal") return ym+"_Q"+(dia<=15?1:2);
  if(frec==="Bimestral") return bimKey(ym);
  if(frec==="Semestral") return semKey(ym);
  return ym;
}
function esFinde(y,m,d){ var wd=new Date(y,m-1,d).getDay(); return wd===0||wd===6; }
function esFestivo(fecha, config){ return !!(config.festivos && config.festivos[fecha]); }
function esSabadoLaboral(fecha, config){ return !!(config.sabadosLaborales && config.sabadosLaborales[fecha]); }
// Un día cuenta como laboral si: no es festivo, y (es lunes–viernes) o (es sábado marcado como laboral). Domingo nunca.
function esDiaLaboral(ym, d, config){
  var y=+ym.slice(0,4),m=+ym.slice(5,7),wd=new Date(y,m-1,d).getDay();
  if(wd===0) return false;
  var f=ym+"-"+(d<10?"0"+d:d);
  if(esFestivo(f,config)) return false;
  if(wd>=1 && wd<=5) return true;
  // Sábado: laboral por defecto (ASPM trabaja Lun–Sáb), SALVO los marcados como "no se trabaja".
  if(wd===6) return !(config && config.sabadosNoLaborales && config.sabadosNoLaborales[f]);
  return false;
}
function ausenciaDe(cargoId, fecha, config){ return (config.ausencias && config.ausencias[cargoId] && config.ausencias[cargoId][fecha]) || null; }
// Días hábiles contables: Lun–Vie, sin festivos, SIN injustificadas (las justificadas SÍ cuentan, a medio valor).
function diasHabiles(ym, cargoId, config){ return ocurrencias("Diario",ym,cargoId,config).filter(function(o){return o.tipo!=="injustificada";}).length; }
function diasInjustificados(ym, cargoId, config){
  var last=ultimoDia(ym),n=0;
  for(var d=1; d<=last; d++){
    if(!esDiaLaboral(ym,d,config)) continue;
    var fecha=ym+"-"+(d<10?"0"+d:d);
    var au=ausenciaDe(cargoId,fecha,config);
    if(au && au.tipo==="injustificada") n++;
  }
  return n;
}
// Días laborales del mes (Lun–Vie + sábados marcados, menos festivos). Base estable para el valor de un día.
function diasLaboralesMes(ym, config){
  var last=ultimoDia(ym),n=0;
  for(var d=1; d<=last; d++){ if(esDiaLaboral(ym,d,config)) n++; }
  return n;
}

// ===================== CÁLCULO DE CUMPLIMIENTO (por periodos) =====================
function tareaPct(t, regCargo, ym, config, cargoId){
  var fk=frecKey(t.frec); var reg=regCargo[fk]||{};
  var ocs=ocurrencias(t.frec, ym, cargoId, config);
  if(t.frec==="Diario"){
    var total=0, hechos=0;
    ocs.forEach(function(o){
      if(o.tipo==="justificada") return;             // justificada: excluida, no penaliza
      total++;                                        // normal o injustificada: día programado
      if(o.tipo==="injustificada") return;            // injustificada: cuenta como NO cumplida (penaliza)
      if(reg[o.key] && reg[o.key][t.cod] && reg[o.key][t.cod].done){ hechos++; }
    });
    return { pct: total>0?Math.round(hechos/total*100):0, hechos:hechos, base:total, aplica:true, baseTxt:hechos+"/"+total+" días", ocs:ocs, fk:fk };
  }
  var total=ocs.length, hechos=0;
  ocs.forEach(function(o){ if(reg[o.key] && reg[o.key][t.cod] && reg[o.key][t.cod].done) hechos++; });
  var aplica=true;
  if((t.frec==="Bimestral"||t.frec==="Semestral"||t.frec==="Ocasional") && hechos===0) aplica=false;
  var unidad = t.frec==="Semanal"?" semanas":t.frec==="Quincenal"?" quincenas":"";
  return { pct: total>0?Math.round(hechos/total*100):0, hechos:hechos, base:total, aplica:aplica, baseTxt:hechos+"/"+total+unidad, ocs:ocs, fk:fk };
}
function calcCumplimientoMes(cargo, regCargo, ym, config){
  regCargo=regCargo||{};
  var criticoRojo=false;
  (cargo.tareas||[]).forEach(function(t){ var r=tareaPct(t, regCargo, ym, config, cargo.id); if(t.crit && r.aplica && r.pct<100) criticoRojo=true; });
  var pctFinal=0, real=(typeof cumplimientoEditable==="function")?cumplimientoEditable(cargo, regCargo, config, ym):null;
  if(real && real.pct!==null && real.pct!==undefined){ pctFinal=real.pct; }

// ===================== MOTOR EDITABLE (la app es la fuente de verdad) =====================
// La estructura (KPIs, actividades, pesos, frecuencias) vive en cfg.estructura y el admin la edita.
// El cumplimiento se mide POR OCURRENCIAS DEL MES (igual que las casillas de la bitácora):
//   cada actividad tiene N ocurrencias en el mes (Diario = días hábiles, Semanal = 4, Quincenal = 2,
//   Mensual = 1, etc.). Programadas = ocurrencias del mes ; Cumplidas = las marcadas.
//   Resultado del KPI = Σ cumplidas ÷ Σ programadas de sus actividades, ponderado por el peso.
//   Así, mes vacío ≈ 0%, mes completo = 100%, y el panel coincide EXACTO con el informe.

// Convierte "15, 30" -> [15,30] (días del mes 1..31)
function parseDias(s){ if(!s) return []; return String(s).split(/[^0-9]+/).map(Number).filter(function(n){return n>=1&&n<=31;}); }

// Deriva los "cargos" (lo que usan Login, Bitácora, Bono, Calendario) desde la estructura editable.
function cargosDesdeEstructura(est){
  return Object.keys(est||{}).map(function(id){
    var r=est[id]||{}, tareas=[];
    (r.kpis||[]).forEach(function(k){
      (k.actividades||[]).forEach(function(a){
        tareas.push({cod:a.cod, nom:a.nom, frec:a.frec, fechaLimite:a.fechaLimite||null, recordatorio:a.recordatorio||"", diasTxt:(a.diasTxt||""), dias:parseDias(a.diasTxt), meta:"100%", crit:!!a.crit, campo:null, nota:"", peso:1, kpiId:k.id, kpiNom:k.nombre});
      });
    });
    return {id:id, cargo:r.cargo||id, persona:r.persona||"", reporta:r.reporta||"", area:r.area||"contable", normaliza:!!r.normaliza, kpis:(r.kpis||[]), tareas:tareas};
  });
}

// Estadística de una actividad en el mes: {prog, cump, aplica, baseTxt}
// Ocasional/Bimestral/Semestral sólo "aplican" si se marcó algo o tienen fecha límite en el mes.
function statActividad(t, reg, config, ym, cargoId){
  var r=tareaPct(t, reg, ym, config, cargoId); // {pct,hechos,base,aplica,baseTxt,...}
  var ocas=(t.frec==="Bimestral"||t.frec==="Semestral"||t.frec==="Ocasional");
  var prog, cump, aplica;
  if(ocas){
    var lim = t.fechaLimite && String(t.fechaLimite).slice(0,7)===ym;
    if(r.hechos>0 || lim){ prog=r.base; cump=r.hechos; aplica=true; } else { prog=0; cump=0; aplica=false; }
  } else {
    prog=r.base; cump=r.hechos; aplica=prog>0;
  }
  return { prog:prog, cump:cump, aplica:aplica, baseTxt:r.baseTxt };
}

// Cumplimiento del mes por KPI (coincide con el informe).
function cumplimientoEditable(cargo, reg, config, ym){
  var kpis=(cargo && cargo.kpis)||[]; if(!kpis.length) return null;
  reg=reg||{};
  var acc=0, appPeso=0, naplica=0, det=[];
  kpis.forEach(function(k){
    var prog=0, cump=0, cods=[];
    (k.actividades||[]).forEach(function(a){
      cods.push(a.cod);
      var s=statActividad(a, reg, config, ym, cargo.id);
      prog+=s.prog; cump+=s.cump;
    });
    var aplica=prog>0, compl=aplica?cump/prog:0;
    if(aplica){ acc+=k.peso*compl; appPeso+=k.peso; naplica++; }
    det.push({ n:k.nombre, peso:k.peso, cods:cods, prog:Math.round(prog), cump:Math.round(cump),
               aplica:aplica, compl:Math.round(compl*100), aporte: aplica?(cargo.normaliza?0:Math.round(k.peso*compl*100)):0 });
  });
  var pctRaw = (cargo.normaliza ? (appPeso>0?acc/appPeso:0) : acc) * 100;
  // Con faltas injustificadas, redondear HACIA ABAJO (97.8 -> 97); si no, al más cercano.
  var injust = (typeof diasInjustificados==="function") ? diasInjustificados(ym, cargo.id, config) : 0;
  var pctFinal = injust>0 ? Math.floor(pctRaw) : Math.round(pctRaw);
  return { pct:pctFinal, nAplica:naplica, normaliza:!!cargo.normaliza, kpis:det };
}

  sh.getCell("A1").value="CUMPLIMIENTO KPI — "+(rol.persona||"")+(rol.cargo?(" ("+rol.cargo+")"):""); sh.getCell("A1").font={bold:true,size:13};
  sh.getCell("A2").value="Período: "+periodo; sh.getCell("A2").font={bold:true};
  var HDR=4, hr=sh.getRow(HDR); hr.values=["KPI","Peso","Resultado","Obtenido","Estado"]; hr.font={bold:true};
  hr.eachCell(function(c){ c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF1A2E0A"}}; c.font={bold:true,color:{argb:"FFFFFFFF"}}; });
  var qd="'"+nombreDet.replace(/'/g,"''")+"'!";
  var r0=HDR+1, rr=r0;
  ranges.forEach(function(g){
    var pr=qd+"E"+g.first+":E"+g.last, cu=qd+"F"+g.first+":F"+g.last;
    sh.getCell("A"+rr).value=g.k.nombre;
    sh.getCell("B"+rr).value=g.k.peso; sh.getCell("B"+rr).numFmt="0%";
    sh.getCell("C"+rr).value={formula:"IF(SUM("+pr+")=0,\"\",SUM("+cu+")/SUM("+pr+"))"}; sh.getCell("C"+rr).numFmt="0%";
    sh.getCell("D"+rr).value={formula:"IF(C"+rr+"=\"\",\"\",B"+rr+"*C"+rr+")"}; sh.getCell("D"+rr).numFmt="0%";
    sh.getCell("E"+rr).value={formula:"IF(C"+rr+"=\"\",\"No aplica\",IF(C"+rr+">=1,\"Alcanzado\",IF(C"+rr+">=0.8,\"Parcial\",\"Bajo\")))"};
    rr++;
  });
  var rEnd=rr-1, B="B"+r0+":B"+rEnd, C="C"+r0+":C"+rEnd, D="D"+r0+":D"+rEnd, rTot=rr+1;
  sh.getCell("A"+rTot).value="CUMPLIMIENTO DEL MES"; sh.getCell("A"+rTot).font={bold:true};
  var cumplExpr = rol.normaliza ? ("IF(SUMPRODUCT(("+C+"<>\"\")*"+B+")=0,0,SUM("+D+")/SUMPRODUCT(("+C+"<>\"\")*"+B+"))") : ("SUM("+D+")");
  if(floorPct) cumplExpr = "INT(("+cumplExpr+")*100)/100";   // con faltas injustificadas: redondea hacia abajo (INT = piso)
  sh.getCell("C"+rTot).value={formula:cumplExpr};
  sh.getCell("C"+rTot).numFmt="0%"; sh.getCell("C"+rTot).font={bold:true};
  var uc=bono.uc, up=bono.up, den=(((up-uc)||0.0001)).toFixed(6);
  var rEsp=rTot+2, rPct=rTot+3, rAlc=rTot+4, rDesc=rTot+5, rLiq=rTot+6;
  sh.getCell("A"+rEsp).value="Bonificación esperada (monto base)"; sh.getCell("A"+rEsp).font={bold:true};
  sh.getCell("D"+rEsp).value=(rol.montoBase||0); sh.getCell("D"+rEsp).numFmt='"$"#,##0';
  sh.getCell("A"+rPct).value="Bono % (umbral "+Math.round(uc*100)+"% · pleno "+Math.round(up*100)+"%)";
  sh.getCell("D"+rPct).value={formula:"IF(C"+rTot+"<="+uc+",0,IF(C"+rTot+">="+up+",1,(C"+rTot+"-"+uc+")/"+den+"))"}; sh.getCell("D"+rPct).numFmt="0%";
  sh.getCell("A"+rAlc).value="Bonificación alcanzada"; sh.getCell("A"+rAlc).font={bold:true};
  sh.getCell("D"+rAlc).value={formula:"D"+rEsp+"*D"+rPct}; sh.getCell("D"+rAlc).numFmt='"$"#,##0';
  sh.getCell("A"+rDesc).value="Descuento por faltas injustificadas"; sh.getCell("A"+rDesc).font={color:{argb:"FFB91C1C"}};
  sh.getCell("D"+rDesc).value=-(rol.descuento||0); sh.getCell("D"+rDesc).numFmt='"$"#,##0;[Red]-"$"#,##0'; sh.getCell("D"+rDesc).font={color:{argb:"FFB91C1C"}};
  sh.getCell("A"+rLiq).value="BONIFICACIÓN A LIQUIDAR"; sh.getCell("A"+rLiq).font={bold:true,size:12};
  sh.getCell("D"+rLiq).value={formula:"MAX(0,D"+rAlc+"+D"+rDesc+")"}; sh.getCell("D"+rLiq).numFmt='"$"#,##0'; sh.getCell("D"+rLiq).font={bold:true,size:12,color:{argb:"FF10B981"}};
  return { cumplCell:"C"+rTot, bonoPctCell:"D"+rPct, liquidarCell:"D"+rLiq, scorecardSheet:nombreSc };
}

function bonoCfgDe(config){ return { uc:((config&&config.bono&&config.bono.umbralCero)||80)/100, up:((config&&config.bono&&config.bono.umbralPleno)||95)/100 }; }

// Informe individual (un wb con las 2 hojas de la persona)
function construirInformeWB(ExcelJS, rol, ym, perKpi, bono, floorPct){
  bono=bono||{uc:0.8,up:0.95};
  var wb=new ExcelJS.Workbook(); wb.creator="Bitácora Contable ASPM"; wb.created=new Date();
  var ref=agregarHojasPersona(wb, rol, ym, perKpi, bono, "Actividades", "Resumen KPI", floorPct);
  return { wb:wb, totalCell:ref.cumplCell };
}

// Consolidado: una hoja por persona (con fórmulas) + hoja "Resumen y Bono" que enlaza cada una.
function exportarConsolidado(cfg, registros, cierres, ym, areaNombre){
  registros=registros||{}; cierres=cierres||{};
  var wb=new ExcelJS.Workbook(); wb.creator="Bitácora ASPM";
  var periodo=_periodoYm(ym), bono=bonoCfgDe(cfg), refs=[];
  (cfg.cargos||[]).forEach(function(c){
    var reg=registros[c.id]||{};
    var montoBase=(cfg.bono&&cfg.bono.montoBase&&cfg.bono.montoBase[c.id])||0;
    var ci=(cierres[ym]&&cierres[ym][c.id])||{};
    var injust=(typeof diasInjustificados==="function")?diasInjustificados(ym,c.id,cfg):0;
    var diasLab=(typeof diasLaboralesMes==="function")?diasLaboralesMes(ym,cfg):0;
    var descSug=diasLab>0?Math.round(montoBase/diasLab*injust):0;
    var desc=(ci.descuento!==undefined&&ci.descuento!=="")?Number(ci.descuento):descSug;
    var rol={cargo:c.cargo,persona:c.persona,normaliza:!!c.normaliza,montoBase:montoBase,descuento:desc};
    if(c.kpis && c.kpis.length){
      var perKpi=perKpiDe(c,reg,cfg,ym);
      var baseN=(c.persona||c.cargo||c.id);
      var ref=agregarHojasPersona(wb, rol, ym, perKpi, bono, "Det "+baseN, baseN, injust>0);
      refs.push({cargo:c.cargo, persona:c.persona||"(sin asignar)", sheet:ref.scorecardSheet, cumplCell:ref.cumplCell, bonoPctCell:ref.bonoPctCell, liquidarCell:ref.liquidarCell, base:montoBase, desc:desc, bloq:!!ci.bloqueado, formula:true});
    } else {
      var ws=wb.addWorksheet(_saneaHoja(c.persona||c.cargo||c.id));
      ws.getCell("A1").value=(c.cargo||"").toUpperCase(); ws.getCell("A1").font={bold:true,size:13};
      ws.getCell("A2").value="Sin KPIs configurados aún · Período: "+periodo;
      var res=(typeof calcCumplimientoMes==="function")?calcCumplimientoMes(c,reg,ym,cfg):{pct:0};
      refs.push({cargo:c.cargo, persona:c.persona||"(sin asignar)", cumpl:(res.pct||0), base:montoBase, desc:desc, bloq:!!ci.bloqueado, formula:false});
    }
  });
  var rs=wb.addWorksheet("Resumen y Bono");
  rs.addRow([(areaNombre?("BITÁCORA "+String(areaNombre).toUpperCase()):"BITÁCORA")+" — RESUMEN Y BONIFICACIÓN"]); rs.getRow(1).font={bold:true,size:14};
  rs.addRow(["ASPM SAS  ·  Período: "+periodo]);
  rs.addRow(["Reglas: umbral "+Math.round(bono.uc*100)+"% · meta plena "+Math.round(bono.up*100)+"%. El cumplimiento y el bono de cada fila vienen enlazados de la hoja de cada persona."]);
  rs.addRow([]);
  var H=rs.addRow(["Cargo","Responsable","Cumplimiento","Bono %","Monto base","Descuento faltas","Bono a liquidar","Estado"]);
  H.font={bold:true}; H.eachCell(function(c){ c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF1A2E0A"}}; c.font={bold:true,color:{argb:"FFFFFFFF"}}; });
  refs.forEach(function(f){
    var r=rs.addRow([f.cargo, f.persona, "", "", f.base, f.desc, "", f.bloq?"Cerrado":"Abierto"]);
    if(f.formula){
      var q="'"+f.sheet.replace(/'/g,"''")+"'!";
      r.getCell(3).value={formula:q+f.cumplCell};
      r.getCell(4).value={formula:q+f.bonoPctCell};
      r.getCell(7).value={formula:q+f.liquidarCell};
    } else { r.getCell(3).value=(f.cumpl||0)/100; r.getCell(4).value=0; r.getCell(7).value=0; }
    r.getCell(3).numFmt="0%"; r.getCell(4).numFmt="0%"; r.getCell(5).numFmt='"$"#,##0'; r.getCell(6).numFmt='"$"#,##0'; r.getCell(7).numFmt='"$"#,##0';
  });
  rs.getColumn(1).width=34; rs.getColumn(2).width=22; [3,4,5,6,7,8].forEach(function(i){rs.getColumn(i).width=15;});
  var slugA=areaNombre?("_"+String(areaNombre).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"")):"";
  wb.xlsx.writeBuffer().then(function(buf){ kpiBajarBlob(buf, "Bitacora"+slugA+"_"+ym+".xlsx"); });
}

function kpiBajarBlob(buf, name){
  var blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  var url=URL.createObjectURL(blob), a=document.createElement("a"); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(function(){ try{URL.revokeObjectURL(url);}catch(e){} a.remove(); },200);
}

// arma perKpi (con prog/cump por ocurrencias) para un cargo/mes
function perKpiDe(cargo, reg, config, ym){
  return (cargo.kpis||[]).map(function(k){
    return { nombre:k.nombre, peso:k.peso, actividades:(k.actividades||[]).map(function(a){
      var t={cod:a.cod,nom:a.nom,frec:a.frec,fechaLimite:a.fechaLimite||null,meta:"100%",peso:1};
      var s=statActividad(t, reg, config, ym, cargo.id);
      return { cod:a.cod, nom:a.nom, frec:a.frec, prog:Math.round(s.prog), cump:Math.round(s.cump), baseTxt:s.baseTxt };
    }) };
  });
}

// Genera y descarga el informe KPI del rol, desde la estructura.
function genInformeEditable(cargo, reg, config, ym, cierres){
  var kpis=(cargo && cargo.kpis)||[];
  if(!kpis.length){ alert("Este rol aún no tiene KPIs. Créalos primero en 🛠️ Estructura."); return false; }
  reg=reg||{};
  var montoBase=(config&&config.bono&&config.bono.montoBase&&config.bono.montoBase[cargo.id])||0;
  // descuento por faltas injustificadas (mismo criterio que el panel de Bonificación)
  var injust=(typeof diasInjustificados==="function")?diasInjustificados(ym, cargo.id, config):0;
  var diasLab=(typeof diasLaboralesMes==="function")?diasLaboralesMes(ym, config):0;
  var descSug=diasLab>0?Math.round(montoBase/diasLab*injust):0;
  var ci=(cierres && cierres[ym] && cierres[ym][cargo.id])||{};
  var desc=(ci.descuento!==undefined && ci.descuento!=="")?Number(ci.descuento):descSug;
  var rol={ id:cargo.id, cargo:cargo.cargo, persona:cargo.persona, normaliza:!!cargo.normaliza, montoBase:montoBase, descuento:desc };
  try{
    var perKpi=perKpiDe(cargo, reg, config, ym);
    var r=construirInformeWB(ExcelJS, rol, ym, perKpi, bonoCfgDe(config), injust>0);
    r.wb.xlsx.writeBuffer().then(function(buf){ kpiBajarBlob(buf, "Informe_KPI_"+cargo.id+"_"+ym+".xlsx"); });
    return true;
  }catch(e){ alert("Error generando el informe: "+e.message); return false; }
}

// ===================== APP =====================
function App(){
  var [config,setConfig]=useState(null);
  var [registros,setRegistros]=useState({});
  var [cierres,setCierres]=useState({});
  var [ready,setReady]=useState(false);
  var [vista,setVista]=useState("areas");
  var [cargoActivo,setCargoActivo]=useState(null);
  var [areaActiva,setAreaActiva]=useState(null);
  var [adminOk,setAdminOk]=useState(false);
  var [bitAdmin,setBitAdmin]=useState(false);

  useEffect(function(){
    var defc={estructura:JSON.parse(JSON.stringify(ESTRUCTURA_DEFAULT)), cargos:CARGOS_DEFAULT, areas:AREAS_DEFAULT, bono:BONO_DEFAULT, semaforo:SEMAFORO_DEFAULT, passwords:{}, festivos:{}, ausencias:{}, sabadosLaborales:{}, sabadosNoLaborales:{}, recoveryCode:RECOVERY_DEFAULT, horario:{inicio:"08:00",fin:"18:00"}};
    // 1) Arranque inmediato: caché local si existe, si no los valores por defecto (nunca se queda en "Cargando").
    setConfig(lsGet("config")||defc);
    var lr=lsGet("registros"); if(lr){ lr=podarRegistros(lr,MESES_EN_VIVO); setRegistros(lr); lsSet("registros",lr); } // limpia cualquier caché local vieja
    var lx=lsGet("cierres");  if(lx) setCierres(lx);
    setReady(true);
    // 2) Firebase (si conecta) manda y refresca la caché local; si no hay conexión, se sigue con lo local.
    var rc=db.ref(DBPATHS.config), rr=db.ref(DBPATHS.registros), rx=db.ref(DBPATHS.cierres);
    try{
      rc.on("value",function(s){ var v=s.val(); if(v){ setConfig(v); lsSet("config",v); } else { try{rc.set(defc);}catch(e){} } });
      rr.on("value",function(s){ var v=s.val()||{}; setRegistros(v); lsSet("registros",podarRegistros(v,MESES_EN_VIVO)); }); // estado completo en línea; caché local solo últimos N meses
      rx.on("value",function(s){ var v=s.val()||{}; setCierres(v); lsSet("cierres",v); });
    }catch(e){}
    return function(){ try{rc.off(); rr.off(); rx.off();}catch(e){} };
  },[]);

  if(!ready || !config) return <div style={{textAlign:"center",padding:"80px 20px",color:"#64748b"}}>Cargando Bitácora Contable…</div>;
  var cfg=Object.assign({cargos:CARGOS_DEFAULT,bono:BONO_DEFAULT,semaforo:SEMAFORO_DEFAULT,passwords:{},festivos:{},ausencias:{},sabadosLaborales:{},sabadosNoLaborales:{},recoveryCode:RECOVERY_DEFAULT,horario:{inicio:"08:00",fin:"18:00"}}, config);
  if(!cfg.bono) cfg.bono=BONO_DEFAULT; if(!cfg.semaforo) cfg.semaforo=SEMAFORO_DEFAULT; if(!cfg.areas || !cfg.areas.length) cfg.areas=AREAS_DEFAULT; cfg.festivos=Object.assign({},FESTIVOS_DEFAULT,cfg.festivos||{}); if(!cfg.ausencias) cfg.ausencias={};
  if(!cfg.estructura) cfg.estructura=JSON.parse(JSON.stringify(ESTRUCTURA_DEFAULT));
  cfg.cargos=cargosDesdeEstructura(cfg.estructura);

  function guardarConfig(nc){ setConfig(nc); lsSet("config",nc); try{db.ref(DBPATHS.config).set(nc);}catch(e){} }
  function guardarSlot(cargoId, fk, slot, mapa){
    setRegistros(function(prev){ var nr=Object.assign({},prev); nr[cargoId]=Object.assign({},nr[cargoId]||{}); nr[cargoId][fk]=Object.assign({},nr[cargoId][fk]||{}); nr[cargoId][fk][slot]=mapa; lsSet("registros",nr); return nr; });
    try{db.ref(DBPATHS.registros+"/"+cargoId+"/"+fk+"/"+slot).set(mapa);}catch(e){}
  }
  function guardarCierre(ym,cargoId,obj){
    setCierres(function(prev){ var nc=Object.assign({},prev); nc[ym]=Object.assign({},nc[ym]||{}); nc[ym][cargoId]=obj; lsSet("cierres",nc); return nc; });
    try{db.ref(DBPATHS.cierres+"/"+ym+"/"+cargoId).set(obj);}catch(e){}
  }

  if(vista==="admin"){
    if(!adminOk) return <AdminLock pwd={(cfg.passwords&&cfg.passwords.__admin__)||ADMIN_PWD_DEFAULT} recoveryCode={cfg.recoveryCode||RECOVERY_DEFAULT} onResetPwd={function(np){ var npw=Object.assign({},cfg.passwords||{}); npw.__admin__=np; guardarConfig(Object.assign({},cfg,{passwords:npw})); }} onOk={function(){setAdminOk(true);}} onBack={function(){setVista(areaActiva?"login":"areas");}}/>;
    return <Admin config={cfg} registros={registros} cierres={cierres} guardarConfig={guardarConfig} guardarCierre={guardarCierre} onCorregir={function(c){ setCargoActivo(c); setBitAdmin(true); setVista("bitacora"); }} onBack={function(){setVista(areaActiva?"login":"areas");setAdminOk(false);}}/>;
  }
  if(vista==="bitacora" && cargoActivo){
    return <Bitacora cargo={cargoActivo} config={cfg} registros={registros} cierres={cierres} guardarSlot={guardarSlot} guardarCierre={guardarCierre} esAdmin={bitAdmin} onBack={function(){ if(bitAdmin){ setBitAdmin(false); setVista("admin"); } else { setVista("login"); } setCargoActivo(null); }}/>;
  }
  if(vista==="login" && areaActiva){
    return <Login config={cfg} area={areaActiva} onSelect={function(c){setCargoActivo(c);setVista("bitacora");}} onAdmin={function(){setVista("admin");}} onBack={function(){setAreaActiva(null);setVista("areas");}}/>;
  }
  return <PantallaAreas config={cfg} onSelect={function(a){setAreaActiva(a);setVista("login");}} onAdmin={function(){setVista("admin");}}/>;
}

          <div style={{textAlign:"left"}}>
            <div style={{fontSize:20,fontWeight:900,color:"#1a2e0a",lineHeight:1}}>{area.nombre}</div>
            <div style={{fontSize:12,color:"#64748b"}}>ASPM SAS · KPIs y bonificación</div>
            <div style={{fontSize:10.5,color:acol,fontWeight:800,marginTop:2}}>{APP_VERSION}</div>
          </div>
        </div>
      </div>
      {props.onBack && <div style={{textAlign:"center",marginBottom:10}}><button onClick={props.onBack} style={{padding:"6px 14px",borderRadius:9,border:"1.5px solid #e2e8f0",background:"#fff",color:"#64748b",fontWeight:700,fontSize:12,cursor:"pointer"}}>← Cambiar área</button></div>}
      <div style={{fontSize:14,color:"#64748b",textAlign:"center",marginBottom:14}}>¿Quién eres?</div>
      {lista.length===0 && <div style={{textAlign:"center",color:"#94a3b8",fontSize:13,padding:"26px 14px",background:"#f8fafc",border:"1.5px dashed #e2e8f0",borderRadius:14,maxWidth:420,margin:"0 auto"}}>Esta área aún no tiene cargos.<br/>El administrador puede asignarlos en ⚙️ Administración → 👥 Cargos.</div>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:12}}>
        {lista.map(function(c,i){
          var sp=!c.persona; var tienePw=!!(cfg.passwords&&cfg.passwords[c.id]);
          return (
            <button key={c.id} onClick={function(){ if(!sp) clic(c); }} disabled={sp}
              style={{textAlign:"left",padding:16,borderRadius:16,border:"2px solid #e2e8f0",background:sp?"#f8fafc":"#fff",cursor:sp?"not-allowed":"pointer",opacity:sp?0.7:1,boxShadow:"0 2px 8px rgba(0,0,0,0.05)"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                <div style={{width:40,height:40,borderRadius:11,background:AVATAR_BG[i%AVATAR_BG.length],display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:800}}>{initials(c.persona||c.cargo)}</div>
                <div style={{fontWeight:800,fontSize:14,color:"#1e293b"}}>{c.persona||"(Sin asignar)"} {tienePw && <span style={{fontSize:11}}>🔒</span>}</div>
              </div>
              <div style={{fontSize:12,color:"#475569",fontWeight:600}}>{c.cargo}</div>
              <div style={{fontSize:11,color:"#94a3b8",marginTop:2}}>{c.tareas.length} tareas</div>
              {sp && <div style={{fontSize:10,color:"#b91c1c",fontWeight:700,marginTop:6}}>Pendiente de asignar responsable</div>}
            </button>
          );
        })}
      </div>
      <div style={{textAlign:"center",marginTop:22}}>
        <button onClick={props.onAdmin} style={{padding:"9px 18px",borderRadius:10,border:"1.5px solid #e2e8f0",background:"#fff",color:"#64748b",fontWeight:700,fontSize:13,cursor:"pointer"}}>⚙️ Administración</button>
      </div>
    </div>
  );
}

// ===================== BITÁCORA (colaborador) — modelo por periodos =====================
function Bitacora(props){
  var cargo=props.cargo, cfg=props.config;
  var esAdmin=!!props.esAdmin;
  var [fecha,setFecha]=useState(hoyStr());
  var ym=fecha.slice(0,7);
  var reg=(props.registros[cargo.id])||{};
  var cierre=(props.cierres[ym] && props.cierres[ym][cargo.id])||null;
  var bloqueado=cierre && cierre.bloqueado;
  var hora=horarioCfg(cfg); var horaOk=dentroDeHorario(cfg);
  // ¿se puede marcar esta casilla? Admin: cualquier día. Auxiliar: solo la ocurrencia actual (hoy / periodo actual) y dentro del horario.
  // Día del mes en que se habilita una ocurrencia (si la actividad tiene día estipulado). null = sin bloqueo.
  function diaEstipulado(t, frec, oKey){
    if(!t) return null;
    // Fecha específica (mes + día): el botón se habilita solo ese día, dentro de su mes.
    if(t.fechaLimite && t.fechaLimite.slice(0,7)===ym && frec!=="Quincenal") return +t.fechaLimite.slice(8,10);
    var dias=(t.dias||[]);          // Días: día(s) del mes que se repiten cada mes (sin mes específico)
    if(!dias.length) return null;
    if(frec==="Quincenal"){
      if(oKey===ym+"_Q1") return dias[0];
      if(oKey===ym+"_Q2") return (dias[1]!=null?dias[1]:dias[0]);
      return dias[0];
    }
    return dias[0];
  }
  function editable(o, frec, t){
    if(bloqueado) return false;
    if(esAdmin) return true;
    if(!horaOk) return false;
    var de=diaEstipulado(t, frec, o.key);          // bloqueo por día estipulado
    if(de!=null){ var hy=hoyStr(); return hy.slice(0,7)===ym && (+hy.slice(8,10))===de; }
    if(frec==="Diario") return !!o.hoy;
    return o.key===slotActualKey(frec, hoyStr());
  }

  var res=calcCumplimientoMes(cargo, reg, ym, cfg);
  var sem=colorSemaforo(res.pct, cfg.semaforo);
  var msg = res.pct>=cfg.semaforo.verde ? "¡Excelente! Vas por encima de la meta 🎉" :
            res.pct>=cfg.semaforo.amarillo ? "¡Vas bien! Un último empujón 💪" :
            res.pct>0 ? "Vas avanzando, sigue marcando tus tareas 👍" : "Empieza a marcar tus tareas";

  var au=ausenciaDe(cargo.id, fecha, cfg);
  var festivo=esFestivo(fecha, cfg);

  // guardar cualquier ocurrencia (casilla) de cualquier frecuencia
  function setDato(fk, key, cod, campo, val){
    if(bloqueado) return;
    var slotMap=Object.assign({}, (reg[fk]&&reg[fk][key])||{});
    slotMap[cod]=Object.assign({}, slotMap[cod]||{}); slotMap[cod][campo]=val;
    props.guardarSlot(cargo.id, fk, key, slotMap);
  }

  var porFrec={}; cargo.tareas.forEach(function(t){ (porFrec[t.frec]=porFrec[t.frec]||[]).push(t); });

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
        <button onClick={props.onBack} style={{padding:"7px 12px",borderRadius:9,border:"1.5px solid #e2e8f0",background:"#fff",cursor:"pointer",fontWeight:700,color:"#64748b"}}>← Salir</button>
        <div style={{flex:1}}>
          <div style={{fontWeight:900,fontSize:16,color:"#1a2e0a"}}>{cargo.persona||cargo.cargo}</div>
          <div style={{fontSize:12,color:"#64748b"}}>{cargo.cargo}</div>
        </div>
        <input type="date" value={fecha} onChange={function(e){setFecha(e.target.value||hoyStr());}} style={{padding:"6px 8px",borderRadius:9,border:"1.5px solid #e2e8f0",fontWeight:700,fontSize:12}}/>
      </div>

      {/* Barra Mi avance */}
      <div style={{background:"#fff",borderRadius:16,border:"1px solid #e2e8f0",padding:16,marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:8}}>
          <div style={{fontSize:13,fontWeight:800,color:"#1e293b"}}>💪 Mi avance de {nombreMes(ym)}</div>
          <div style={{fontSize:22,fontWeight:900,color:sem.c}}>{res.pct}%</div>
        </div>
        <div style={{height:16,borderRadius:20,background:"#f1f5f9",overflow:"hidden"}}>
          <div style={{height:"100%",width:res.pct+"%",borderRadius:20,background:sem.c,transition:"width .4s"}}></div>
        </div>
        <div style={{fontSize:12,color:sem.c,fontWeight:700,marginTop:8}}>{sem.e} {msg}</div>
        <div style={{fontSize:11,color:"#64748b",marginTop:3}}>Días hábiles del mes: {res.dh}{res.injust>0?" · ⚠ "+res.injust+" falta(s) injustificada(s)":""}</div>
        <div style={{fontSize:10.5,color:"#94a3b8",marginTop:8,lineHeight:1.4,background:"#f8fafc",borderRadius:8,padding:"6px 9px"}}>ⓘ Este avance es una guía. El cumplimiento final para la bonificación lo valida tu líder al cierre del mes y está sujeto a ajustes.</div>
      </div>

      {bloqueado && (
        <div style={{background:"#f8fafc",border:"1.5px solid #cbd5e1",borderRadius:12,padding:14,marginBottom:12}}>
          <div style={{fontSize:13,fontWeight:800,color:"#1e293b",marginBottom:4}}>🔒 Mes cerrado y validado</div>
          <div style={{fontSize:12,color:"#475569",marginBottom:10}}>Cumplimiento del mes: <b>{cierre.cumplimiento!==undefined?cierre.cumplimiento:(cierre.cumplValidado!==undefined?cierre.cumplValidado:res.pct)}%</b>{cierre.bono!==undefined?<span> · Bono: <b>{fmtCOP(cierre.bono)}</b></span>:null}. Ya no se puede modificar.</div>
          {cierre.aceptado
            ? <div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",color:"#15803d",borderRadius:9,padding:"8px 11px",fontSize:12,fontWeight:700}}>✓ Aceptado el {(cierre.aceptado.fecha||"").slice(0,10)}</div>
            : <button onClick={function(){ props.guardarCierre(ym, cargo.id, Object.assign({}, cierre, {aceptado:{fecha:new Date().toISOString()}})); }} style={{width:"100%",padding:"10px",borderRadius:9,border:"none",background:"#8DC63F",color:"#fff",fontWeight:800,fontSize:13,cursor:"pointer"}}>✍️ Acepto mi cumplimiento y bono</button>}
        </div>
      )}
      {festivo && <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",color:"#1d4ed8",borderRadius:10,padding:"8px 12px",fontSize:12,fontWeight:700,marginBottom:12}}>📅 {fecha}: día festivo (no laboral).</div>}
      {au && <div style={{background:au.tipo==="justificada"?"#f0fdf4":"#fef2f2",border:"1px solid "+(au.tipo==="justificada"?"#bbf7d0":"#fecaca"),color:au.tipo==="justificada"?"#15803d":"#b91c1c",borderRadius:10,padding:"8px 12px",fontSize:12,fontWeight:700,marginBottom:12}}>🏥 {fecha}: ausencia {au.tipo}{au.motivo?" — "+au.motivo:""}.</div>}

      {esAdmin
        ? <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",color:"#1d4ed8",borderRadius:10,padding:"8px 12px",fontSize:12,fontWeight:700,marginBottom:12}}>✏️ Modo administrador — puedes corregir cualquier día y cualquier casilla.</div>
        : (horaOk
            ? <div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",color:"#15803d",borderRadius:10,padding:"8px 12px",fontSize:12,fontWeight:700,marginBottom:12}}>🕐 Horario de marcación abierto ({hora.inicio}–{hora.fin}). Marca las tareas de hoy; solo puedes marcar el día actual.</div>
            : <div style={{background:"#fffbeb",border:"1px solid #fde68a",color:"#b45309",borderRadius:10,padding:"8px 12px",fontSize:12,fontWeight:700,marginBottom:12}}>🕐 Fuera del horario de marcación ({hora.inicio}–{hora.fin}). Lo que no se marcó queda como no realizado. Si hubo un error, avisa al administrador para corregirlo.</div>)}

      {/* TAREAS CON CASILLAS (una por cada vez que se hace en el mes) */}
      {FRECUENCIAS.filter(function(f){return porFrec[f];}).map(function(f){
        var emoji = f==="Diario"?"📅":"📆";
        var sub = f==="Diario"?"una casilla por día hábil":f==="Semanal"?"4 veces en el mes":f==="Quincenal"?"2 veces en el mes":"1 vez";
        return (
          <div key={f} style={{marginBottom:14}}>
            <div style={{fontSize:12,fontWeight:800,color:"#475569",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:6}}>{emoji} {f} <span style={{color:"#94a3b8",fontWeight:600}}>· {sub}, marca cada vez que la hagas</span></div>
            <div style={{display:"flex",flexDirection:"column",gap:7}}>
              {porFrec[f].map(function(t){
                var r=tareaPct(t,reg,ym,cfg,cargo.id);
                var slotK=slotActualKey(f,fecha);
                var st=((reg[r.fk]&&reg[r.fk][slotK])||{})[t.cod]||{};
                var pct=r.pct;
                var recTxt = t.recordatorio || ((t.dias&&t.dias.length)?("día"+(t.dias.length>1?"s":"")+" "+t.dias.join(" y ")):"");
                var fechaTxt = fechaRecordatorio(t, ym);
                return (
                  <div key={t.cod+t.nom} style={{background:"#fff",border:"1.5px solid "+(pct>=100?"#86efac":"#e2e8f0"),borderRadius:12,padding:"10px 12px"}}>
                    <div style={{fontSize:13,fontWeight:700,color:"#1e293b"}}>
                      {t.cod!=="—" && <span style={{fontSize:10,fontWeight:800,color:"#64748b",marginRight:6}}>{t.cod}</span>}
                      {t.nom}
                      {t.crit && <span style={{fontSize:9,fontWeight:800,background:"#fee2e2",color:"#b91c1c",borderRadius:20,padding:"1px 6px",marginLeft:6}}>⚠ CRÍTICO</span>}
                    </div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:6,margin:"5px 0 2px"}}>
                      {recTxt && <span style={{display:"inline-flex",alignItems:"center",gap:5,background:"#eff6ff",border:"1px solid #bfdbfe",color:"#1d4ed8",borderRadius:8,padding:"4px 9px",fontSize:11.5,fontWeight:800}}>📅 Recordatorio: {recTxt}</span>}
                      {fechaTxt && <span style={{display:"inline-flex",alignItems:"center",gap:5,background:"#fffbeb",border:"1px solid #fde68a",color:"#b45309",borderRadius:8,padding:"4px 9px",fontSize:11.5,fontWeight:800}}>🗓️ {fechaTxt}</span>}
                    </div>
                    <div style={{fontSize:11,color:"#94a3b8",margin:"3px 0 6px"}}>Meta: {t.meta} · {r.baseTxt} ({pct}%)</div>
                    <div style={{height:7,borderRadius:20,background:"#f1f5f9",overflow:"hidden",marginBottom:8}}><div style={{height:"100%",width:pct+"%",background:pct>=100?"#16a34a":pct>=50?"#f59e0b":"#8DC63F",transition:"width .3s"}}></div></div>
                    {t.nota && <div style={{marginBottom:8,background:"#eff6ff",borderRadius:8,padding:"6px 9px",fontSize:11.5,color:"#1e40af",fontWeight:600}}>📌 {t.nota}</div>}
                    <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                      {r.ocs.map(function(o){
                        var done=reg[r.fk]&&reg[r.fk][o.key]&&reg[r.fk][o.key][t.cod]&&reg[r.fk][o.key][t.cod].done;
                        var esHoy=!!o.hoy;
                        var ancho = f==="Diario"?32 : (f==="Semanal"||f==="Quincenal")?48 : 110;
                        if(o.tipo==="injustificada"){
                          return <button key={o.key} disabled title={o.key+" · falta injustificada (no cuenta)"} style={{minWidth:ancho,height:30,borderRadius:7,border:"2px solid #ef4444",background:"#fee2e2",color:"#b91c1c",fontWeight:800,fontSize:11,cursor:"not-allowed",padding:"0 5px"}}>✗ {o.label}</button>;
                        }
                        if(o.tipo==="justificada"){
                          return <button key={o.key} disabled title={o.key+" · ausencia justificada (cuenta medio)"} style={{minWidth:ancho,height:30,borderRadius:7,border:"2px solid #3b82f6",background:"#dbeafe",color:"#1d4ed8",fontWeight:800,fontSize:11,cursor:"not-allowed",padding:"0 5px"}}>½ {o.label}</button>;
                        }
                        var puede=editable(o,f,t);
                        var deLock=(!esAdmin)?diaEstipulado(t,f,o.key):null;
                        return <button key={o.key} onClick={function(){ if(puede) setDato(r.fk,o.key,t.cod,"done",!done); }} disabled={!puede} title={o.key+(puede?"":(deLock!=null?" · se habilita el día "+deLock:" · solo lectura"))}
                          style={{minWidth:ancho,height:30,borderRadius:7,border:"2px solid "+(done?"#16a34a":(puede&&esHoy)?"#3b82f6":"#cbd5e1"),background:done?"#16a34a":(puede&&esHoy)?"#eff6ff":(puede?"#fff":"#f8fafc"),color:done?"#fff":(puede&&esHoy)?"#1d4ed8":(puede?"#64748b":"#cbd5e1"),opacity:(!puede&&!done)?0.75:1,fontWeight:800,fontSize:11,cursor:puede?"pointer":"not-allowed",padding:"0 5px"}}>
                          {done?"✓ ":""}{o.label}
                        </button>;
                      })}
                    </div>
                    {t.campo && <div style={{display:"flex",alignItems:"center",gap:6,marginTop:8}}><span style={{fontSize:11,fontWeight:700,color:"#64748b"}}>{t.campo}:</span><input value={st.valor||""} disabled={bloqueado || (!esAdmin && !horaOk)} onChange={function(e){setDato(r.fk,slotK,t.cod,"valor",e.target.value);}} placeholder="—" style={{flex:1,padding:"5px 8px",borderRadius:7,border:"1.5px solid #e2e8f0",fontSize:13,fontWeight:700}}/></div>}
                    <input value={st.obs||""} disabled={bloqueado || (!esAdmin && !horaOk)} onChange={function(e){setDato(r.fk,slotK,t.cod,"obs",e.target.value);}} placeholder="Observaciones del periodo actual…" style={{width:"100%",boxSizing:"border-box",marginTop:7,padding:"5px 8px",borderRadius:7,border:"1px solid #eef2f6",fontSize:12}}/>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ===================== ADMIN =====================
function AdminLock(props){
  var [p,setP]=useState(""); var [err,setErr]=useState(false);
  var [modo,setModo]=useState("login"); // login | recuperar
  var [code,setCode]=useState(""); var [np1,setNp1]=useState(""); var [msg,setMsg]=useState("");
  function go(){ if(p===props.pwd) props.onOk(); else setErr(true); }
  function recuperar(){
    if(code!==props.recoveryCode){ setMsg("Código de recuperación incorrecto"); return; }
    if(!np1 || np1.length<4){ setMsg("La nueva contraseña debe tener al menos 4 caracteres"); return; }
    props.onResetPwd(np1); setMsg(""); setModo("login"); setP(np1); alert("Contraseña actualizada. Ya puedes entrar.");
  }
  if(modo==="recuperar"){
    return (
      <div style={{maxWidth:360,margin:"50px auto",textAlign:"center"}}>
        <div style={{fontSize:30,marginBottom:8}}>🔑</div>
        <div style={{fontWeight:800,fontSize:16,marginBottom:6}}>Recuperar contraseña</div>
        <div style={{fontSize:12,color:"#64748b",marginBottom:14}}>Ingresa tu código de recuperación y define una nueva contraseña.</div>
        <input value={code} onChange={function(e){setCode(e.target.value);setMsg("");}} placeholder="Código de recuperación" style={{width:"100%",boxSizing:"border-box",padding:"10px 12px",borderRadius:10,border:"1.5px solid #e2e8f0",fontSize:14,marginBottom:8}}/>
        <input type="password" value={np1} onChange={function(e){setNp1(e.target.value);setMsg("");}} placeholder="Nueva contraseña" style={{width:"100%",boxSizing:"border-box",padding:"10px 12px",borderRadius:10,border:"1.5px solid #e2e8f0",fontSize:14,marginBottom:10}}/>
        {msg && <div style={{color:"#ef4444",fontSize:12,marginBottom:8}}>{msg}</div>}
        <button onClick={recuperar} style={{width:"100%",padding:"10px",borderRadius:10,border:"none",background:"#8DC63F",color:"#fff",fontWeight:800,cursor:"pointer",marginBottom:8}}>Cambiar contraseña</button>
        <button onClick={function(){setModo("login");setMsg("");}} style={{width:"100%",padding:"9px",borderRadius:10,border:"1.5px solid #e2e8f0",background:"#fff",color:"#64748b",fontWeight:700,cursor:"pointer"}}>← Volver</button>
      </div>
    );
  }
  return (
    <div style={{maxWidth:340,margin:"60px auto",textAlign:"center"}}>
      <div style={{fontSize:30,marginBottom:8}}>🔒</div>
      <div style={{fontWeight:800,fontSize:16,marginBottom:14}}>Acceso administración</div>
      <input type="password" value={p} onChange={function(e){setP(e.target.value);setErr(false);}} onKeyDown={function(e){if(e.key==="Enter")go();}} placeholder="Contraseña" style={{width:"100%",boxSizing:"border-box",padding:"10px 12px",borderRadius:10,border:"1.5px solid "+(err?"#ef4444":"#e2e8f0"),fontSize:14,marginBottom:10}}/>
      {err && <div style={{color:"#ef4444",fontSize:12,marginBottom:8}}>Contraseña incorrecta</div>}
      <button onClick={go} style={{width:"100%",padding:"10px",borderRadius:10,border:"none",background:"#8DC63F",color:"#fff",fontWeight:800,cursor:"pointer",marginBottom:8}}>Entrar</button>
      <button onClick={function(){setModo("recuperar");}} style={{width:"100%",padding:"7px",borderRadius:10,border:"none",background:"transparent",color:"#0369a1",fontWeight:700,fontSize:12,cursor:"pointer",marginBottom:8}}>¿Olvidaste la contraseña?</button>
      <button onClick={props.onBack} style={{width:"100%",padding:"9px",borderRadius:10,border:"1.5px solid #e2e8f0",background:"#fff",color:"#64748b",fontWeight:700,cursor:"pointer"}}>← Volver</button>
    </div>
  );
}

// ===================== PANEL: Tareas/KPIs (vista agrupada, desde la estructura editable) =====================
function PanelTareas(props){
  var cfg=props.config;
  var [aid,setAid]=useState(primeraAreaId(cfg));
  var lista=(cfg.cargos||[]).filter(function(c){return areaIdDe(c)===aid;});
  var [cid,setCid]=useState((lista[0]||cfg.cargos[0]||{}).id);
  var [ym,setYm]=useState(hoyMes());
  function selArea(a){ setAid(a); var l=(cfg.cargos||[]).filter(function(c){return areaIdDe(c)===a;}); setCid((l[0]||{}).id); }
  var cargo=lista.find(function(c){return c.id===cid;}) || lista[0];
  var info = cargo ? cumplimientoEditable(cargo, (props.registros&&props.registros[cargo.id])||{}, cfg, ym) : null;
  function tareaDe(cod){ return (cargo.tareas||[]).find(function(t){return t.cod===cod;}) || {cod:cod,nom:cod,frec:""}; }
  function barra(pct,color){ return <div style={{height:7,background:"#eef2f7",borderRadius:5,overflow:"hidden",marginTop:5}}><div style={{width:Math.max(0,Math.min(100,pct))+"%",height:"100%",background:color}}/></div>; }
  return (
    <div>
      <div style={{background:"#f0fdf4",border:"1px solid #86efac",borderRadius:10,padding:"10px 12px",marginBottom:10,fontSize:11.5,color:"#166534",lineHeight:1.4}}>📊 <b>KPIs por rol.</b> Cada KPI agrupa las actividades que se marcan en el calendario; su cumplimiento (según el peso) suma al total del mes — igual que el informe. Para editarlos usa la pestaña <b>🛠️ Estructura</b>.</div>
      <AreaChips areas={cfg.areas} sel={aid} onSel={selArea}/>
      {lista.length===0 && <div style={{background:"#fff",border:"1.5px dashed #e2e8f0",borderRadius:12,padding:18,fontSize:12.5,color:"#94a3b8",textAlign:"center"}}>Esta área no tiene cargos. Asígnalos en 👥 Cargos.</div>}
      {lista.length>0 && <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:12}}>
        <select value={cid} onChange={function(e){setCid(e.target.value);}} style={{flex:1,minWidth:200,padding:"9px",borderRadius:10,border:"1.5px solid #e2e8f0",fontWeight:700,fontSize:13}}>{lista.map(function(c){return <option key={c.id} value={c.id}>{c.cargo}{c.persona?" — "+c.persona:""}</option>;})}</select>
        <select value={ym} onChange={function(e){setYm(e.target.value);}} style={{padding:"9px",borderRadius:10,border:"1.5px solid #e2e8f0",fontWeight:700,fontSize:13}}>{mesesRecientes(12).map(function(m){return <option key={m} value={m}>{nombreMes(m)}</option>;})}</select>
      </div>}
      {!info && (
        <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:12,padding:16,fontSize:12.5,color:"#64748b",lineHeight:1.5}}>
          Este rol aún no tiene KPIs. Créalos en <b>🛠️ Estructura</b>: agrega los KPIs, sus actividades y pesos, y aparecerán aquí.
        </div>
      )}
      {info && (
        <div>
          <div style={{background:"#1a2e0a",borderRadius:14,padding:"12px 14px",marginBottom:12,display:"flex",alignItems:"center",justifyContent:"space-between",color:"#fff"}}>
            <div><div style={{fontSize:11,opacity:0.8,fontWeight:700}}>CUMPLIMIENTO DEL MES · {nombreMes(ym)}</div><div style={{fontSize:11,opacity:0.7}}>{info.kpis.length} KPIs{info.normaliza?" · se normaliza por lo aplicable":""}</div></div>
            <div style={{fontSize:30,fontWeight:900,color:"#8DC63F"}}>{info.pct}%</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {info.kpis.map(function(kpi,i){
              var col = !kpi.aplica?"#94a3b8":(kpi.compl>=100?"#15803d":kpi.compl>=50?"#b45309":"#dc2626");
              return (
                <div key={i} style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:12,padding:"11px 13px"}}>
                  <div style={{display:"flex",alignItems:"flex-start",gap:8}}>
                    <div style={{width:26,height:26,borderRadius:8,background:"#eef7e0",color:"#3d6b10",fontWeight:900,fontSize:12,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{i+1}</div>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:800,fontSize:13,color:"#1e293b",lineHeight:1.25}}>{kpi.n}</div>
                      <div style={{fontSize:11,color:"#64748b",marginTop:2}}>
                        {kpi.aplica
                          ? <span>Cumplimiento <b style={{color:col}}>{kpi.compl}%</b> ({kpi.cump}/{kpi.prog}){!info.normaliza && <span> · aporta <b style={{color:"#15803d"}}>{kpi.aporte}%</b> de {Math.round(kpi.peso*100)}%</span>}</span>
                          : <span style={{color:"#94a3b8"}}>No aplica este mes (sin vencimientos programados)</span>}
                      </div>
                    </div>
                    <div style={{textAlign:"right",flexShrink:0}}>
                      <div style={{fontSize:10,color:"#94a3b8",fontWeight:700}}>PESO</div>
                      <div style={{fontSize:16,fontWeight:900,color:"#0369a1"}}>{Math.round(kpi.peso*100)}%</div>
                    </div>
                  </div>
                  {kpi.aplica && barra(kpi.compl,col)}
                  <div style={{marginTop:8,display:"flex",flexDirection:"column",gap:4}}>
                    {kpi.cods.map(function(cod){ var t=tareaDe(cod); return (
                      <div key={cod} style={{display:"flex",alignItems:"center",gap:7,fontSize:11.5,color:"#475569",paddingLeft:34}}>
                        <span style={{fontWeight:800,color:"#94a3b8",fontSize:10,minWidth:40}}>{cod}</span>
                        <span style={{flex:1}}>{t.nom}</span>
                        <span style={{fontSize:10,color:"#64748b",background:"#f1f5f9",borderRadius:20,padding:"1px 8px",fontWeight:700,whiteSpace:"nowrap"}}>{t.frec}</span>
                      </div>
                    ); })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// ===================== PANEL: Informe KPI (descarga; genera desde la estructura) =====================
function PanelInformeKPI(props){
  var cfg=props.config;
  var [aid,setAid]=useState(primeraAreaId(cfg));
  var lista=(cfg.cargos||[]).filter(function(c){return areaIdDe(c)===aid;});
  var [cid,setCid]=useState((lista[0]||cfg.cargos[0]||{}).id);
  var [ym,setYm]=useState(hoyMes());
  var [busy,setBusy]=useState(false);
  function selArea(a){ setAid(a); var l=(cfg.cargos||[]).filter(function(c){return areaIdDe(c)===a;}); setCid((l[0]||{}).id); }
  var cargo=lista.find(function(c){return c.id===cid;}) || lista[0];
  var tieneKpis=!!(cargo && cargo.kpis && cargo.kpis.length);
  function bajar(){ if(!tieneKpis) return; setBusy(true); genInformeEditable(cargo,(props.registros&&props.registros[cargo.id])||{},cfg,ym,props.cierres); setTimeout(function(){setBusy(false);},1200); }
  return (
    <div>
      <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:10,padding:"10px 12px",marginBottom:12,fontSize:11.5,color:"#1e40af",lineHeight:1.4}}>📥 <b>Informe KPI (solo admin).</b> Genera el Excel del rol para el mes elegido, con el calendario, el cumplimiento por KPI y el bono — todo con fórmulas vivas, calculado desde la estructura que configuraste.</div>
      <AreaChips areas={cfg.areas} sel={aid} onSel={selArea}/>
      {lista.length===0 && <div style={{background:"#fff",border:"1.5px dashed #e2e8f0",borderRadius:12,padding:18,fontSize:12.5,color:"#94a3b8",textAlign:"center"}}>Esta área no tiene cargos. Asígnalos en 👥 Cargos.</div>}
      {lista.length>0 && <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:12}}>
        <select value={cid} onChange={function(e){setCid(e.target.value);}} style={{flex:1,minWidth:200,padding:"9px",borderRadius:10,border:"1.5px solid #e2e8f0",fontWeight:700,fontSize:13}}>{lista.map(function(c){return <option key={c.id} value={c.id}>{c.cargo}{c.persona?" — "+c.persona:""}</option>;})}</select>
        <select value={ym} onChange={function(e){setYm(e.target.value);}} style={{padding:"9px",borderRadius:10,border:"1.5px solid #e2e8f0",fontWeight:700,fontSize:13}}>{mesesRecientes(12).map(function(m){return <option key={m} value={m}>{nombreMes(m)}</option>;})}</select>
      </div>}
      {lista.length>0 && <button onClick={bajar} disabled={!tieneKpis||busy} style={{width:"100%",padding:"12px",borderRadius:11,border:"none",background:tieneKpis?"#15803d":"#cbd5e1",color:"#fff",fontWeight:800,fontSize:14,cursor:tieneKpis?"pointer":"not-allowed"}}>{busy?"Generando…":("📥 Descargar informe de "+(cargo?(cargo.persona||cargo.cargo):""))}</button>}
      {lista.length>0 && !tieneKpis && <div style={{fontSize:12,color:"#94a3b8",marginTop:10}}>Este rol aún no tiene KPIs. Créalos en 🛠️ Estructura para poder generar su informe.</div>}
    </div>
  );
}

// ===================== PANEL: Estructura KPI (EDITOR — solo admin) =====================
function PanelEstructura(props){
  var cfg=props.config;
  var ids=Object.keys(cfg.estructura||{});
  var [aid,setAid]=useState(primeraAreaId(cfg));
  function idsDe(a){ return ids.filter(function(id){ return ((cfg.estructura[id]||{}).area||"contable")===a; }); }
  var idsArea=idsDe(aid);
  var [cid,setCid]=useState(idsArea[0]||ids[0]);
  var [draft,setDraft]=useState(function(){ return JSON.parse(JSON.stringify((cfg.estructura&&cfg.estructura[cid])||{kpis:[]})); });
  var [msg,setMsg]=useState("");
  function cargar(id){ setCid(id); setDraft(JSON.parse(JSON.stringify((cfg.estructura&&cfg.estructura[id])||{kpis:[]}))); setMsg(""); }
  function selArea(a){ setAid(a); var la=idsDe(a); if(la[0]) cargar(la[0]); }
  function upd(fn){ var d=JSON.parse(JSON.stringify(draft)); fn(d); setDraft(d); setMsg(""); }
  var kpis=draft.kpis||[];
  var sumaPeso=kpis.reduce(function(s,k){return s+(Number(k.peso)||0);},0);
  var sumaOk=Math.abs(sumaPeso-1)<0.0001;

  function prefijo(){ return ({cartera:"CA",tesoreria:"TE",contadora:"CD",coordinadora:"CO",nomina:"KN"})[cid] || cid.slice(0,2).toUpperCase(); }
  function nuevoCod(d){ var mx=0; (d.kpis||[]).forEach(function(k){(k.actividades||[]).forEach(function(a){ var m=/(\d+)\s*$/.exec(a.cod||""); if(m){var n=+m[1]; if(n>mx)mx=n;} });}); return prefijo()+(mx+1<10?"0":"")+(mx+1); }

  function addKpi(){ upd(function(d){ d.kpis=d.kpis||[]; d.kpis.push({id:"K"+Date.now(), nombre:"Nuevo KPI", peso:0, actividades:[]}); }); }
  function delKpi(i){ if(!confirm("¿Eliminar este KPI y todas sus actividades?")) return; upd(function(d){ d.kpis.splice(i,1); }); }
  function moveKpi(i,dir){ upd(function(d){ var j=i+dir; if(j<0||j>=d.kpis.length) return; var t=d.kpis[i]; d.kpis[i]=d.kpis[j]; d.kpis[j]=t; }); }
  function setKpi(i,campo,val){ upd(function(d){ d.kpis[i][campo]=val; }); }
  function addAct(i){ upd(function(d){ d.kpis[i].actividades=d.kpis[i].actividades||[]; d.kpis[i].actividades.push({cod:nuevoCod(d), nom:"", frec:"Mensual", fechaLimite:null}); }); }
  function delAct(i,j){ var a=(draft.kpis[i].actividades||[])[j]||{}; if(!confirm("¿Eliminar la actividad "+(a.cod||"")+(a.nom?" — "+a.nom:"")+"?\n\nEsta acción no se puede deshacer.")) return; upd(function(d){ d.kpis[i].actividades.splice(j,1); }); }
  function setAct(i,j,campo,val){ upd(function(d){ d.kpis[i].actividades[j][campo]=(val===""&&campo==="fechaLimite")?null:val; }); }

  function guardar(){
    // validar códigos únicos
    var vistos={}, dup=null;
    kpis.forEach(function(k){(k.actividades||[]).forEach(function(a){ if(!a.cod){dup="(vacío)";} else if(vistos[a.cod]){dup=a.cod;} vistos[a.cod]=1; });});
    if(dup){ alert("Hay un código de actividad repetido o vacío: "+dup+". Corrígelo antes de guardar."); return; }
    if(!sumaOk){ if(!confirm("Los pesos suman "+(sumaPeso*100).toFixed(1)+"%, no 100%. El cumplimiento se calculará igual, pero lo recomendado es que sumen 100%. ¿Guardar de todos modos?")) return; }
    var est=JSON.parse(JSON.stringify(cfg.estructura||{}));
    // normalizar pesos a número
    draft.kpis.forEach(function(k){ k.peso=Number(k.peso)||0; });
    est[cid]=draft;
    props.guardar(Object.assign({},cfg,{estructura:est}));
    setMsg("✓ Estructura guardada. El informe y los paneles ya reflejan estos cambios.");
  }

  var lbl={fontSize:11,fontWeight:700,color:"#64748b",marginBottom:3};
  var inp={width:"100%",boxSizing:"border-box",padding:"7px 9px",borderRadius:8,border:"1.5px solid #e2e8f0",fontSize:13};
  return (
    <div>
      <div style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:10,padding:"10px 12px",marginBottom:12,fontSize:11.5,color:"#92400e",lineHeight:1.45}}>🛠️ <b>Editor de estructura (solo admin).</b> Agrega, edita, reordena o elimina KPIs y actividades, y ajusta los pesos. <b>La app es la fuente de verdad:</b> lo que guardes aquí se refleja en los KPIs del rol, en el cumplimiento y en el informe descargable. Los cambios no afectan las marcas ya registradas.</div>

      <AreaChips areas={cfg.areas} sel={aid} onSel={selArea}/>
      {idsArea.length===0 && <div style={{background:"#fff",border:"1.5px dashed #e2e8f0",borderRadius:12,padding:18,fontSize:12.5,color:"#94a3b8",textAlign:"center"}}>Esta área no tiene cargos. Asígnalos en 👥 Cargos.</div>}

      {idsArea.length>0 && <React.Fragment>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:12}}>
        <select value={cid} onChange={function(e){cargar(e.target.value);}} style={{flex:1,minWidth:220,padding:"9px",borderRadius:10,border:"1.5px solid #e2e8f0",fontWeight:800,fontSize:13}}>
          {idsArea.map(function(id){return <option key={id} value={id}>{(cfg.estructura[id].cargo||id)}</option>;})}
        </select>
        <div style={{fontSize:12,fontWeight:800,padding:"7px 12px",borderRadius:9,background:sumaOk?"#f0fdf4":"#fef2f2",color:sumaOk?"#15803d":"#b91c1c",border:"1px solid "+(sumaOk?"#bbf7d0":"#fecaca")}}>Σ pesos: {(sumaPeso*100).toFixed(0)}%{sumaOk?" ✓":" ⚠"}</div>
      </div>

      {/* Datos del rol */}
      <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:12,padding:13,marginBottom:12}}>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          <div style={{flex:"1 1 160px"}}><div style={lbl}>Persona</div><input value={draft.persona||""} onChange={function(e){upd(function(d){d.persona=e.target.value;});}} style={inp} placeholder="(sin asignar)"/></div>
          <div style={{flex:"1 1 200px"}}><div style={lbl}>Cargo</div><input value={draft.cargo||""} onChange={function(e){upd(function(d){d.cargo=e.target.value;});}} style={inp}/></div>
        </div>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:10,alignItems:"flex-end"}}>
          <div style={{flex:"1 1 200px"}}><div style={lbl}>Reporta a</div><input value={draft.reporta||""} onChange={function(e){upd(function(d){d.reporta=e.target.value;});}} style={inp}/></div>
          <label style={{display:"flex",alignItems:"center",gap:7,fontSize:12,fontWeight:700,color:"#475569",padding:"7px 0"}}>
            <input type="checkbox" checked={!!draft.normaliza} onChange={function(e){upd(function(d){d.normaliza=e.target.checked;});}} style={{width:16,height:16}}/>
            Normalizar por lo aplicable
            <span title="Si se marca, el % del mes se divide entre la suma de pesos de los KPIs que SÍ aplican ese mes (como el Coordinador). Si no, cada KPI que no aplica baja el total." style={{color:"#94a3b8",cursor:"help"}}>ⓘ</span>
          </label>
        </div>
      </div>

      {/* KPIs */}
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        {kpis.map(function(k,i){
          var sumaActNote = (k.actividades||[]).length+" actividad(es)";
          return (
            <div key={k.id||i} style={{background:"#fff",border:"1.5px solid #e2e8f0",borderRadius:14,padding:13}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                <div style={{width:26,height:26,borderRadius:8,background:"#eef7e0",color:"#3d6b10",fontWeight:900,fontSize:12,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{i+1}</div>
                <input value={k.nombre} onChange={function(e){setKpi(i,"nombre",e.target.value);}} style={{flex:1,minWidth:120,padding:"7px 9px",borderRadius:8,border:"1.5px solid #e2e8f0",fontSize:13,fontWeight:700}} placeholder="Nombre del KPI"/>
                <div style={{display:"flex",alignItems:"center",gap:3}}>
                  <input type="number" value={Math.round((Number(k.peso)||0)*100)} onChange={function(e){setKpi(i,"peso",(Number(e.target.value)||0)/100);}} style={{width:58,padding:"7px 6px",borderRadius:8,border:"1.5px solid #e2e8f0",fontSize:13,fontWeight:800,textAlign:"right"}}/>
                  <span style={{fontSize:13,fontWeight:800,color:"#0369a1"}}>%</span>
                </div>
                <button onClick={function(){moveKpi(i,-1);}} title="Subir" style={ic()}>▲</button>
                <button onClick={function(){moveKpi(i,1);}} title="Bajar" style={ic()}>▼</button>
                <button onClick={function(){delKpi(i);}} title="Eliminar KPI" style={Object.assign({},ic(),{color:"#ef4444"})}>🗑</button>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {(k.actividades||[]).map(function(a,j){ return (
                  <div key={j} style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center",background:"#f8fafc",borderRadius:9,padding:"7px 8px"}}>
                    <input value={a.cod} onChange={function(e){setAct(i,j,"cod",e.target.value);}} style={{width:62,padding:"6px",borderRadius:7,border:"1.5px solid #e2e8f0",fontSize:11,fontWeight:800,textAlign:"center"}} placeholder="Cód"/>
                    <input value={a.nom} onChange={function(e){setAct(i,j,"nom",e.target.value);}} style={{flex:"3 1 180px",padding:"6px 8px",borderRadius:7,border:"1.5px solid #e2e8f0",fontSize:12}} placeholder="Nombre de la actividad"/>
                    <select value={a.frec} onChange={function(e){setAct(i,j,"frec",e.target.value);}} style={{flex:"1 1 110px",padding:"6px",borderRadius:7,border:"1.5px solid #e2e8f0",fontSize:12,fontWeight:700}}>{FRECUENCIAS.map(function(f){return <option key={f} value={f}>{f}</option>;})}</select>
                    <input type="date" value={a.fechaLimite||""} onChange={function(e){setAct(i,j,"fechaLimite",e.target.value);}} title="Fecha límite (opcional; necesaria para frecuencias Ocasional/Anual)" style={{width:140,padding:"5px 7px",borderRadius:7,border:"1.5px solid #e2e8f0",fontSize:12}}/>
                    <input value={a.recordatorio||""} onChange={function(e){setAct(i,j,"recordatorio",e.target.value);}} title="Recordatorio visible para el responsable en la bitácora (p. ej. 'día 24', '15 y 30', 'martes')" placeholder="📅 Recordatorio (visible al rol)" style={{flex:"2 1 140px",minWidth:120,padding:"6px 8px",borderRadius:7,border:"1.5px solid #bfdbfe",background:"#f5faff",fontSize:12}}/>
                    <input value={a.diasTxt||""} onChange={function(e){setAct(i,j,"diasTxt",e.target.value);}} title="Día(s) del mes en que se habilita el botón para el responsable (p. ej. 24  ó  15,30). Vacío = sin bloqueo, puede marcar en el período." placeholder="🔒 Días" style={{width:90,padding:"6px 8px",borderRadius:7,border:"1.5px solid #fde68a",background:"#fffdf5",fontSize:12,fontWeight:700}}/>
                    <button onClick={function(){delAct(i,j);}} title="Quitar actividad" style={Object.assign({},ic(),{color:"#ef4444"})}>✕</button>
                  </div>
                ); })}
              </div>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:8}}>
                <span style={{fontSize:10.5,color:"#94a3b8"}}>{sumaActNote}</span>
                <button onClick={function(){addAct(i);}} style={{padding:"6px 11px",borderRadius:8,border:"1.5px dashed #86efac",background:"#f0fdf4",color:"#15803d",fontWeight:700,fontSize:12,cursor:"pointer"}}>+ actividad</button>
              </div>
            </div>
          );
        })}
      </div>

      <button onClick={addKpi} style={{width:"100%",marginTop:12,padding:"11px",borderRadius:11,border:"1.5px dashed #cbd5e1",background:"#f8fafc",color:"#475569",fontWeight:800,fontSize:13,cursor:"pointer"}}>+ Agregar KPI</button>

      <div style={{position:"sticky",bottom:0,marginTop:14,background:"linear-gradient(#ffffff00,#ffffff 30%)",paddingTop:10}}>
        {msg && <div style={{fontSize:12,fontWeight:700,color:"#15803d",marginBottom:8}}>{msg}</div>}
        <div style={{fontSize:10.5,color:"#64748b",marginBottom:8,lineHeight:1.4}}>📅 <b>Recordatorio</b>: texto que ve el responsable en su bitácora para saber cuándo hacer la actividad (p. ej. "día 24", "15 y 30"). · 🔒 <b>Días</b>: el/los día(s) del mes en que se le habilita el botón para marcar (p. ej. 24, ó 15,30). Si lo dejas vacío, puede marcar durante el período como siempre. Tú (admin) puedes marcar cualquier día. · <b>Ocasional/Bimestral/Semestral</b> sólo cuentan en el mes donde pongas una fecha límite.</div>
        <button onClick={guardar} style={{width:"100%",padding:"13px",borderRadius:12,border:"none",background:"#15803d",color:"#fff",fontWeight:900,fontSize:14,cursor:"pointer",boxShadow:"0 4px 12px rgba(21,128,61,.3)"}}>💾 Guardar estructura de {draft.cargo||cid}</button>
      </div>
      </React.Fragment>}
    </div>
  );
  function ic(){ return {width:30,height:30,borderRadius:8,border:"1.5px solid #e2e8f0",background:"#fff",cursor:"pointer",fontSize:12,fontWeight:800,color:"#64748b",flexShrink:0}; }
}

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
        <button onClick={props.onBack} style={{padding:"7px 12px",borderRadius:9,border:"1.5px solid #e2e8f0",background:"#fff",cursor:"pointer",fontWeight:700,color:"#64748b"}}>← Salir</button>
        <div style={{fontWeight:900,fontSize:16,color:"#1a2e0a"}}>⚙️ Administración</div>
        <div style={{marginLeft:"auto",fontSize:10.5,color:"#8DC63F",fontWeight:800}}>{APP_VERSION}</div>
      </div>
      <div style={{display:"flex",gap:3,flexWrap:"wrap",background:"#fff",borderRadius:12,padding:6,marginBottom:14,border:"1px solid #e2e8f0"}}>
        {tb("bono","💰 Bonificación")}
        {tb("corregir","✏️ Corregir")}
        {tb("cal","📅 Calendario")}
        {tb("areas","🏢 Áreas")}
        {tb("cargos","👥 Cargos")}
        {tb("tareas","📋 Tareas/KPIs")}
        {tb("estructura","🛠️ Estructura")}
        {tb("informe","📥 Informe KPI")}
        {tb("config","🎛️ Reglas")}
      </div>
      {tab==="bono" && <PanelBono config={cfg} registros={props.registros} cierres={props.cierres} guardarCierre={props.guardarCierre} guardar={props.guardarConfig}/>}
      {tab==="corregir" && <PanelCorregir config={cfg} onCorregir={props.onCorregir}/>}
      {tab==="cal" && <PanelCalendario config={cfg} guardar={props.guardarConfig}/>}
      {tab==="areas" && <PanelAreas config={cfg} guardar={props.guardarConfig}/>}
      {tab==="cargos" && <PanelCargos config={cfg} guardar={props.guardarConfig}/>}
      {tab==="tareas" && <PanelTareas config={cfg} registros={props.registros} guardar={props.guardarConfig}/>}
      {tab==="estructura" && <PanelEstructura config={cfg} guardar={props.guardarConfig}/>}
      {tab==="informe" && <PanelInformeKPI config={cfg} registros={props.registros} cierres={props.cierres}/>}
      {tab==="config" && <PanelConfig config={cfg} guardar={props.guardarConfig}/>}
    </div>
  );
}

// ---- Panel Corregir (abrir bitácora como admin) ----
function PanelCorregir(props){
