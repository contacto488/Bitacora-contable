// ---- Panel Bonificación ----
function PanelBono(props){
  var cfg=props.config; var [ym,setYm]=useState(hoyMes());
  var [aid,setAid]=useState(primeraAreaId(cfg));
  var areaSel=areaDe(cfg,aid);
  var cargosArea=(cfg.cargos||[]).filter(function(c){return areaIdDe(c)===aid;});
  function setCierre(cid,obj){ var prev=(props.cierres[ym]&&props.cierres[ym][cid])||{}; props.guardarCierre(ym,cid,Object.assign({},prev,obj)); }
  function setMontoBase(cid,val){ var nb=Object.assign({},cfg.bono.montoBase||{}); nb[cid]=Number(val)||0; props.guardar(Object.assign({},cfg,{bono:Object.assign({},cfg.bono,{montoBase:nb})})); }
  function exportarArea(){ var ca=Object.assign({},cfg,{cargos:cargosArea}); exportarExcel(ca,props.registros,props.cierres,ym,(areaSel&&areaSel.nombre)||""); }
  var filas=cargosArea.map(function(c){
    var reg=props.registros[c.id]||{};
    var res=calcCumplimientoMes(c,reg,ym,cfg);
    var ci=(props.cierres[ym]&&props.cierres[ym][c.id])||{};
    var bonoPct=calcBono(res.pct,false,cfg.bono);        // bono según el avance automático del mes
    var base=(cfg.bono.montoBase&&cfg.bono.montoBase[c.id])||0;
    var bonoBruto=base*bonoPct/100;
    var diasLab = diasLaboralesMes(ym, cfg);
    var descSugerido = diasLab>0 ? Math.round(base/diasLab*res.injust) : 0; // valor de 1 día del monto base
    var desc = (ci.descuento!==undefined&&ci.descuento!=="")?Number(ci.descuento):descSugerido;
    var bonoFinal=Math.max(0, bonoBruto-desc);
    return {c:c,res:res,ci:ci,bonoPct:bonoPct,base:base,desc:desc,descSugerido:descSugerido,bonoFinal:bonoFinal};
  });
  return (
    <div>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,flexWrap:"wrap"}}>
        <span style={{fontWeight:700,fontSize:13,color:"#475569"}}>Período:</span>
        <select value={ym} onChange={function(e){setYm(e.target.value);}} style={{padding:"7px 9px",borderRadius:9,border:"1.5px solid #e2e8f0",fontWeight:700,fontSize:13}}>{mesesRecientes(12).map(function(m){return <option key={m} value={m}>{nombreMes(m)}</option>;})}</select>
        <button onClick={exportarArea} style={{marginLeft:"auto",padding:"8px 14px",borderRadius:9,border:"none",background:"#10b981",color:"#fff",fontWeight:800,fontSize:13,cursor:"pointer"}}>⬇️ Exportar Excel ({(areaSel&&areaSel.nombre)||"área"})</button>
      </div>
      <AreaChips areas={cfg.areas} sel={aid} onSel={setAid}/>
      <div style={{fontSize:11,color:"#64748b",marginBottom:10,lineHeight:1.4}}>Umbral {cfg.bono.umbralCero}% · meta plena {cfg.bono.umbralPleno}%. El bono se calcula con el <b>avance automático</b> del mes (el mismo del informe). Las faltas injustificadas sugieren un descuento (editable).</div>
      {filas.length===0 && <div style={{textAlign:"center",color:"#94a3b8",fontSize:12.5,padding:"20px",background:"#fff",border:"1.5px dashed #e2e8f0",borderRadius:12}}>Esta área no tiene cargos. Asígnalos en 👥 Cargos.</div>}
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {filas.map(function(f){
          var sem=colorSemaforo(f.res.pct,cfg.semaforo); var blo=f.ci.bloqueado;
          return (
            <div key={f.c.id} style={{background:"#fff",border:"1px solid "+(blo?"#86efac":"#e2e8f0"),borderRadius:14,padding:14}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                <div style={{flex:1}}><div style={{fontWeight:800,fontSize:14}}>{f.c.persona||"(Sin asignar)"}</div><div style={{fontSize:11,color:"#64748b"}}>{f.c.cargo}</div></div>
                {blo && <span style={{fontSize:10,fontWeight:800,color:"#15803d"}}>🔒 Cerrado</span>}
                {blo && (f.ci.aceptado ? <span style={{fontSize:10,fontWeight:800,color:"#0369a1"}}>✍️ Aceptado {(f.ci.aceptado.fecha||"").slice(0,10)}</span> : <span style={{fontSize:10,fontWeight:700,color:"#b45309"}}>⏳ Sin aceptar</span>)}
              </div>
              <div style={{background:sem.bg,borderRadius:10,padding:"9px 12px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <div><div style={{color:"#64748b",fontSize:10,fontWeight:700}}>AVANCE AUTOMÁTICO DEL MES</div><div style={{fontSize:10,color:"#64748b"}}>{f.res.dh} días háb.{f.res.injust>0?" · ⚠ "+f.res.injust+" injust.":""}</div></div>
                <div style={{fontSize:26,fontWeight:900,color:sem.c}}>{f.res.pct}% <span style={{fontSize:16}}>{sem.e}</span></div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8,marginTop:9,flexWrap:"wrap"}}>
                <span style={{fontSize:11,color:"#64748b",fontWeight:700}}>Monto base $:</span>
                <input type="number" value={f.base||""} disabled={blo} onChange={function(e){setMontoBase(f.c.id,e.target.value);}} style={{width:120,padding:"5px 8px",borderRadius:7,border:"1.5px solid #e2e8f0",fontSize:13,fontWeight:700}}/>
                <span style={{fontSize:11,color:"#64748b",fontWeight:700,marginLeft:6}}>Descuento faltas $:</span>
                <input type="number" value={f.ci.descuento!==undefined?f.ci.descuento:""} disabled={blo} placeholder={f.descSugerido} onChange={function(e){setCierre(f.c.id,{descuento:e.target.value});}} style={{width:110,padding:"5px 8px",borderRadius:7,border:"1.5px solid "+(f.desc>0?"#fca5a5":"#e2e8f0"),fontSize:13,fontWeight:700,color:f.desc>0?"#b91c1c":"#1e293b"}}/>
                {f.res.injust>0 && <span style={{fontSize:10,color:"#b91c1c"}}>sugerido {fmtCOP(f.descSugerido)} ({f.res.injust} día/s)</span>}
              </div>
              <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",marginTop:10}}>
                <div style={{fontSize:11,color:"#94a3b8"}}>Bono {f.bonoPct}% {f.desc>0?" − desc "+fmtCOP(f.desc):""}</div>
                <div style={{textAlign:"right"}}><div style={{fontSize:10,color:"#94a3b8",fontWeight:700}}>BONO A LIQUIDAR</div><div style={{fontSize:20,fontWeight:900,color:"#10b981"}}>{fmtCOP(f.bonoFinal)}</div></div>
              </div>
              <button onClick={function(){ if(blo){ props.guardarCierre(ym, f.c.id, null); } else { setCierre(f.c.id,{bloqueado:true, cumplimiento:f.res.pct, descuento:f.desc, bonoPct:f.bonoPct, bono:f.bonoFinal, fecha:new Date().toISOString()}); } }} style={{marginTop:10,width:"100%",padding:"8px",borderRadius:9,border:"none",background:blo?"#fef2f2":"#1e293b",color:blo?"#b91c1c":"#fff",fontWeight:800,fontSize:12,cursor:"pointer"}}>{blo?"🔓 Reabrir mes (borra el cierre)":"🔒 Cerrar mes"}</button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---- Panel Calendario ----
function PanelCalendario(props){
  var cfg=props.config;
  var [fFest,setFFest]=useState(hoyStr());
  var [aid,setAid]=useState(primeraAreaId(cfg));
  var listaAus=(cfg.cargos||[]).filter(function(c){return areaIdDe(c)===aid;});
  var [cid,setCid]=useState((listaAus[0]||cfg.cargos[0]||{}).id);
  function selAreaAus(a){ setAid(a); var l=(cfg.cargos||[]).filter(function(c){return areaIdDe(c)===a;}); setCid((l[0]||{}).id); }
  var [fAus,setFAus]=useState(hoyStr());
  var [tipo,setTipo]=useState("justificada");
  var [motivo,setMotivo]=useState("");
  function addFestivo(){ if(!fFest) return; var nf=Object.assign({},cfg.festivos||{}); nf[fFest]=true; props.guardar(Object.assign({},cfg,{festivos:nf})); }
  function delFestivo(f){ var nf=Object.assign({},cfg.festivos||{}); delete nf[f]; props.guardar(Object.assign({},cfg,{festivos:nf})); }
  var [fSab,setFSab]=useState(hoyStr());
  function esSabado(f){ var p=f.split("-"); return new Date(+p[0],+p[1]-1,+p[2]).getDay()===6; }
  function addSabado(){ if(!fSab) return; if(!esSabado(fSab)){ alert("Esa fecha no es un sábado. Elige un sábado."); return; } var ns=Object.assign({},cfg.sabadosNoLaborales||{}); ns[fSab]=true; props.guardar(Object.assign({},cfg,{sabadosNoLaborales:ns})); }
  function delSabado(f){ var ns=Object.assign({},cfg.sabadosNoLaborales||{}); delete ns[f]; props.guardar(Object.assign({},cfg,{sabadosNoLaborales:ns})); }
  function addAusencia(){ if(!fAus) return; var na=JSON.parse(JSON.stringify(cfg.ausencias||{})); if(!na[cid])na[cid]={}; na[cid][fAus]={tipo:tipo,motivo:motivo}; props.guardar(Object.assign({},cfg,{ausencias:na})); setMotivo(""); }
  function delAusencia(ci,f){ var na=JSON.parse(JSON.stringify(cfg.ausencias||{})); if(na[ci]) delete na[ci][f]; props.guardar(Object.assign({},cfg,{ausencias:na})); }
  var festivos=Object.keys(cfg.festivos||{}).sort();
  var inp={padding:"7px 9px",borderRadius:8,border:"1.5px solid #e2e8f0",fontSize:13};
  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:14,padding:14}}>
        <div style={{fontSize:13,fontWeight:800,marginBottom:4}}>📅 Días festivos (todo el equipo)</div>
        <div style={{fontSize:11,color:"#64748b",marginBottom:10}}>No cuentan como día hábil para nadie.</div>
        <div style={{display:"flex",gap:6,marginBottom:10}}>
          <input type="date" value={fFest} onChange={function(e){setFFest(e.target.value);}} style={Object.assign({flex:1},inp)}/>
          <button onClick={addFestivo} style={{padding:"7px 14px",borderRadius:8,border:"none",background:"#8DC63F",color:"#fff",fontWeight:800,cursor:"pointer"}}>+ Agregar</button>
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {festivos.length===0 && <span style={{fontSize:12,color:"#94a3b8"}}>Sin festivos cargados.</span>}
          {festivos.map(function(f){ return <span key={f} style={{display:"inline-flex",alignItems:"center",gap:5,background:"#eff6ff",color:"#1d4ed8",borderRadius:20,padding:"4px 10px",fontSize:12,fontWeight:700}}>{f} <span onClick={function(){delFestivo(f);}} style={{cursor:"pointer",color:"#ef4444",fontWeight:900}}>✕</span></span>; })}
        </div>
      </div>
      <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:14,padding:14}}>
        <div style={{fontSize:13,fontWeight:800,marginBottom:4}}>🗓️ Sábados que NO se trabajan</div>
        <div style={{fontSize:11,color:"#64748b",marginBottom:10}}>Por defecto se trabajan <b>todos los sábados</b> (Lun–Sáb). Marca aquí la excepción: los sábados que NO se trabajan. Esos no cuentan como día hábil (casilla + denominador). Los domingos nunca cuentan.</div>
        <div style={{display:"flex",gap:6,marginBottom:10}}>
          <input type="date" value={fSab} onChange={function(e){setFSab(e.target.value);}} style={Object.assign({flex:1},inp)}/>
          <button onClick={addSabado} style={{padding:"7px 14px",borderRadius:8,border:"none",background:"#ef4444",color:"#fff",fontWeight:800,cursor:"pointer"}}>+ Agregar</button>
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {Object.keys(cfg.sabadosNoLaborales||{}).length===0 && <span style={{fontSize:12,color:"#94a3b8"}}>Sin excepciones: se trabajan todos los sábados.</span>}
          {Object.keys(cfg.sabadosNoLaborales||{}).sort().map(function(f){ return <span key={f} style={{display:"inline-flex",alignItems:"center",gap:5,background:"#fef2f2",color:"#b91c1c",borderRadius:20,padding:"4px 10px",fontSize:12,fontWeight:700}}>{f} <span onClick={function(){delSabado(f);}} style={{cursor:"pointer",color:"#ef4444",fontWeight:900}}>✕</span></span>; })}
        </div>
      </div>
      <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:14,padding:14}}>
        <div style={{fontSize:13,fontWeight:800,marginBottom:4}}>🏥 Ausencias por persona</div>
        <div style={{fontSize:11,color:"#64748b",marginBottom:10}}><b>Justificada</b> (incapacidad, vacaciones, permiso) → no cuenta. <b>Injustificada</b> → cuenta como día no cumplido y sugiere descuento del bono.</div>
        <AreaChips areas={cfg.areas} sel={aid} onSel={selAreaAus}/>
        {listaAus.length===0 && <div style={{textAlign:"center",color:"#94a3b8",fontSize:12.5,padding:"16px",background:"#f8fafc",border:"1.5px dashed #e2e8f0",borderRadius:12}}>Esta área no tiene cargos. Asígnalos en 👥 Cargos.</div>}
        {listaAus.length>0 && <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
          <select value={cid} onChange={function(e){setCid(e.target.value);}} style={inp}>{listaAus.map(function(c){return <option key={c.id} value={c.id}>{c.persona||c.cargo}</option>;})}</select>
          <input type="date" value={fAus} onChange={function(e){setFAus(e.target.value);}} style={inp}/>
          <select value={tipo} onChange={function(e){setTipo(e.target.value);}} style={inp}><option value="justificada">Justificada</option><option value="injustificada">Injustificada</option></select>
          <input value={motivo} onChange={function(e){setMotivo(e.target.value);}} placeholder="Motivo (opcional)" style={Object.assign({flex:1,minWidth:120},inp)}/>
          <button onClick={addAusencia} style={{padding:"7px 14px",borderRadius:8,border:"none",background:"#8DC63F",color:"#fff",fontWeight:800,cursor:"pointer"}}>+ Agregar</button>
        </div>}
        {listaAus.map(function(c){
          var aus=(cfg.ausencias&&cfg.ausencias[c.id])||{}; var ks=Object.keys(aus).sort();
          if(ks.length===0) return null;
          return (
            <div key={c.id} style={{marginTop:8}}>
              <div style={{fontSize:12,fontWeight:700,color:"#475569",marginBottom:4}}>{c.persona||c.cargo}</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {ks.map(function(f){ var a=aus[f]; var just=a.tipo==="justificada"; return <span key={f} style={{display:"inline-flex",alignItems:"center",gap:5,background:just?"#f0fdf4":"#fef2f2",color:just?"#15803d":"#b91c1c",borderRadius:20,padding:"4px 10px",fontSize:11,fontWeight:700}}>{f} · {a.tipo}{a.motivo?" ("+a.motivo+")":""} <span onClick={function(){delAusencia(c.id,f);}} style={{cursor:"pointer",color:"#ef4444",fontWeight:900}}>✕</span></span>; })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---- Panel Áreas (crear / editar / eliminar áreas) ----
function PanelAreas(props){
  var cfg=props.config;
  var areas=cfg.areas||AREAS_DEFAULT;
  var cargos=cfg.cargos||[];
  var [nom,setNom]=useState(""); var [ico,setIco]=useState("🏢"); var [col,setCol]=useState("#64748b");
  var [confirmDel,setConfirmDel]=useState(null);
  function nCargos(aid){ return cargos.filter(function(c){return areaIdDe(c)===aid;}).length; }
  function updArea(aid,campo,val){
    var na=areas.map(function(a){ return a.id===aid?Object.assign({},a,(function(){var o={};o[campo]=val;return o;})()):a; });
    props.guardar(Object.assign({},cfg,{areas:na}));
  }
  function crearArea(){
    var n=nom.trim(); if(!n) return;
    var base=n.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"")||"area";
    var id=base; var k=2; while(areas.some(function(a){return a.id===id;})){ id=base+"_"+k; k++; }
    var na=areas.concat([{id:id, nombre:n, color:col, icono:ico||"🏢"}]);
    props.guardar(Object.assign({},cfg,{areas:na}));
    setNom(""); setIco("🏢"); setCol("#64748b");
  }
  function eliminarArea(aid){
    if(areas.length<=1){ setConfirmDel(null); return; }
    var resto=areas.filter(function(a){return a.id!==aid;});
    var destino=resto[0].id;
    var nc=Object.assign({},cfg,{areas:resto});
    // reasignar cargos huérfanos al área destino para que no desaparezcan
    if(cfg.estructura){
      var est=JSON.parse(JSON.stringify(cfg.estructura));
      Object.keys(est).forEach(function(rid){ if((est[rid].area||"contable")===aid) est[rid].area=destino; });
      nc.estructura=est;
    } else {
      nc.cargos=(cfg.cargos||[]).map(function(c){ return areaIdDe(c)===aid?Object.assign({},c,{area:destino}):c; });
    }
    props.guardar(nc);
    setConfirmDel(null);
  }
  return (
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      <div style={{fontSize:12,color:"#64748b"}}>Crea las áreas de la empresa (Contable, Producción, Ventas, Logística…). En 👥 Cargos asignas cada persona a su área, y cada quien entra eligiendo su área en la pantalla de inicio.</div>
      {areas.map(function(a){
        var n=nCargos(a.id);
        return (
          <div key={a.id} style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:12,padding:12,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <input value={a.icono||""} onChange={function(e){updArea(a.id,"icono",e.target.value);}} maxLength={2} style={{width:44,textAlign:"center",padding:"7px 0",borderRadius:9,border:"1.5px solid #e2e8f0",fontSize:20}}/>
            <input type="color" value={a.color||"#64748b"} onChange={function(e){updArea(a.id,"color",e.target.value);}} title="Color del área" style={{width:38,height:38,border:"1.5px solid #e2e8f0",borderRadius:9,padding:2,cursor:"pointer",background:"#fff"}}/>
            <input value={a.nombre} onChange={function(e){updArea(a.id,"nombre",e.target.value);}} style={{flex:1,minWidth:150,padding:"8px 10px",borderRadius:9,border:"1.5px solid #e2e8f0",fontSize:13,fontWeight:800}}/>
            <span style={{fontSize:11,color:"#94a3b8"}}>{n} {n===1?"cargo":"cargos"}</span>
            {confirmDel===a.id
              ? <span style={{display:"flex",gap:4,alignItems:"center"}}><button onClick={function(){eliminarArea(a.id);}} style={{padding:"5px 9px",borderRadius:7,border:"none",background:"#ef4444",color:"#fff",fontWeight:700,fontSize:11,cursor:"pointer"}}>Sí, borrar</button><button onClick={function(){setConfirmDel(null);}} style={{padding:"5px 9px",borderRadius:7,border:"1.5px solid #e2e8f0",background:"#fff",fontWeight:700,fontSize:11,cursor:"pointer"}}>No</button></span>
              : <button onClick={function(){setConfirmDel(a.id);}} disabled={areas.length<=1} title={areas.length<=1?"Debe existir al menos un área":"Eliminar área"} style={{padding:"6px 10px",borderRadius:7,border:"none",background:areas.length<=1?"#f1f5f9":"#fef2f2",color:areas.length<=1?"#cbd5e1":"#ef4444",fontWeight:700,cursor:areas.length<=1?"not-allowed":"pointer"}}>✕</button>}

          </div>

function PanelCargos(props){
  var cfg=props.config;
  var areas=cfg.areas||AREAS_DEFAULT;
  var [nuevoCargo,setNuevoCargo]=useState("");
  var [nuevoReporta,setNuevoReporta]=useState("Coordinadora Contable y Financiera");
  var [nuevoArea,setNuevoArea]=useState((areas[0]||{}).id||"contable");
  var [confirmDel,setConfirmDel]=useState(null);
  var [filtroArea,setFiltroArea]=useState("__all__");
  // En la versión editable los cargos se derivan de cfg.estructura, así que crear/editar/eliminar escribe allí.
  function updCargo(id,campo,val){
    if(cfg.estructura && cfg.estructura[id]){
      var est=JSON.parse(JSON.stringify(cfg.estructura)); est[id][campo]=val;
      props.guardar(Object.assign({},cfg,{estructura:est}));
    } else {
      props.guardar(Object.assign({},cfg,{cargos:cfg.cargos.map(function(c){return c.id===id?Object.assign({},c,(function(){var o={};o[campo]=val;return o;})()):c;})}));
    }
  }
  function crearCargo(){
    var nom=nuevoCargo.trim(); if(!nom) return;
    var id = "cargo_"+Date.now();
    if(cfg.estructura){
      var est=JSON.parse(JSON.stringify(cfg.estructura)); est[id]={cargo:nom, persona:"", reporta:nuevoReporta||"", area:nuevoArea, normaliza:false, kpis:[]};
      props.guardar(Object.assign({},cfg,{estructura:est}));
    } else {
      var nc=cfg.cargos.concat([{id:id, cargo:nom, persona:"", reporta:nuevoReporta||"", area:nuevoArea, tareas:[]}]);
      props.guardar(Object.assign({},cfg,{cargos:nc}));
    }
    setNuevoCargo("");
  }
  function eliminarCargo(id){
    if(cfg.estructura && cfg.estructura[id]){
      var est=JSON.parse(JSON.stringify(cfg.estructura)); delete est[id];
      var np=Object.assign({},cfg.passwords||{}); delete np[id];
      props.guardar(Object.assign({},cfg,{estructura:est, passwords:np}));
    } else {
      props.guardar(Object.assign({},cfg,{cargos:cfg.cargos.filter(function(c){return c.id!==id;})}));
    }
    setConfirmDel(null);
  }
  return (
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      <div style={{fontSize:12,color:"#64748b"}}>Asigna el responsable de cada cargo (vacío = sin asignar), elige su <b>área</b>, edita el nombre del cargo, o crea/elimina cargos si el equipo crece.</div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
        <span style={{fontSize:11,color:"#94a3b8",fontWeight:700}}>Ver área:</span>
        <button onClick={function(){setFiltroArea("__all__");}} style={{padding:"4px 10px",borderRadius:20,border:"1.5px solid "+(filtroArea==="__all__"?"#8DC63F":"#e2e8f0"),background:filtroArea==="__all__"?"#f7fdf0":"#fff",color:filtroArea==="__all__"?"#3d6b10":"#64748b",fontWeight:700,fontSize:11.5,cursor:"pointer"}}>Todas</button>
        {areas.map(function(a){ return <button key={a.id} onClick={function(){setFiltroArea(a.id);}} style={{padding:"4px 10px",borderRadius:20,border:"1.5px solid "+(filtroArea===a.id?(a.color||"#8DC63F"):"#e2e8f0"),background:filtroArea===a.id?"#f8fafc":"#fff",color:filtroArea===a.id?"#1e293b":"#64748b",fontWeight:700,fontSize:11.5,cursor:"pointer"}}>{a.icono} {a.nombre}</button>; })}
      </div>
      {cfg.cargos.filter(function(c){ return filtroArea==="__all__"||areaIdDe(c)===filtroArea; }).map(function(c){ return (
        <div key={c.id} style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:12,padding:12}}>
          <div style={{display:"flex",gap:6,marginBottom:6}}>
            <input value={c.cargo} onChange={function(e){updCargo(c.id,"cargo",e.target.value);}} style={{flex:1,padding:"7px 9px",borderRadius:8,border:"1.5px solid #e2e8f0",fontSize:13,fontWeight:800}}/>
            {confirmDel===c.id
              ? <span style={{display:"flex",gap:4,alignItems:"center"}}><button onClick={function(){eliminarCargo(c.id);}} style={{padding:"5px 9px",borderRadius:7,border:"none",background:"#ef4444",color:"#fff",fontWeight:700,fontSize:11,cursor:"pointer"}}>Sí, borrar</button><button onClick={function(){setConfirmDel(null);}} style={{padding:"5px 9px",borderRadius:7,border:"1.5px solid #e2e8f0",background:"#fff",fontWeight:700,fontSize:11,cursor:"pointer"}}>No</button></span>
              : <button onClick={function(){setConfirmDel(c.id);}} title="Eliminar cargo" style={{padding:"5px 10px",borderRadius:7,border:"none",background:"#fef2f2",color:"#ef4444",fontWeight:700,cursor:"pointer"}}>✕</button>}
          </div>
          <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:7,flexWrap:"wrap"}}>
            <span style={{fontSize:11,color:"#94a3b8"}}>🏢 Área:</span>
            <select value={areaIdDe(c)} onChange={function(e){updCargo(c.id,"area",e.target.value);}} style={{padding:"5px 8px",borderRadius:7,border:"1.5px solid #cbd5e1",fontSize:11.5,fontWeight:700,background:"#fff",cursor:"pointer"}}>
              {areas.map(function(a){ return <option key={a.id} value={a.id}>{a.icono} {a.nombre}</option>; })}
            </select>
            <span style={{fontSize:11,color:"#94a3b8"}}>· {c.tareas.length} tareas</span>
          </div>
          <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:7,flexWrap:"wrap"}}>
            <span style={{fontSize:11,color:"#94a3b8"}}>Reporta a:</span>
            <input value={c.reporta||""} onChange={function(e){updCargo(c.id,"reporta",e.target.value);}} style={{flex:1,minWidth:150,padding:"5px 8px",borderRadius:7,border:"1.5px solid #eef2f6",fontSize:11}}/>
          </div>
          <input value={c.persona||""} onChange={function(e){updCargo(c.id,"persona",e.target.value);}} placeholder="Nombre del responsable" style={{width:"100%",boxSizing:"border-box",padding:"8px 10px",borderRadius:9,border:"1.5px solid #e2e8f0",fontSize:13,fontWeight:600}}/>
          <div style={{display:"flex",alignItems:"center",gap:6,marginTop:7}}>
            <span style={{fontSize:11,color:"#0369a1",fontWeight:700}}>🔐 Contraseña:</span>
            <input value={(cfg.passwords&&cfg.passwords[c.id])||""} onChange={function(e){ var np=Object.assign({},cfg.passwords||{}); if(e.target.value) np[c.id]=e.target.value; else delete np[c.id]; props.guardar(Object.assign({},cfg,{passwords:np})); }} placeholder="(sin clave — entra directo)" style={{flex:1,padding:"6px 9px",borderRadius:8,border:"1.5px solid #bae6fd",fontSize:12,background:"#f8fbff"}}/>
          </div>
        </div>
      ); })}
      <div style={{background:"#f7fdf0",border:"1.5px dashed #8DC63F",borderRadius:12,padding:12}}>
        <div style={{fontSize:12,fontWeight:800,color:"#3d6b10",marginBottom:7}}>➕ Crear cargo nuevo</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          <input value={nuevoCargo} onChange={function(e){setNuevoCargo(e.target.value);}} placeholder="Nombre del cargo (ej: Auxiliar Contable)" style={{flex:1,minWidth:170,padding:"8px 10px",borderRadius:9,border:"1.5px solid #cbd5e1",fontSize:13}}/>
          <select value={nuevoArea} onChange={function(e){setNuevoArea(e.target.value);}} title="Área del nuevo cargo" style={{minWidth:140,padding:"8px 10px",borderRadius:9,border:"1.5px solid #cbd5e1",fontSize:13,fontWeight:700,background:"#fff",cursor:"pointer"}}>
            {areas.map(function(a){ return <option key={a.id} value={a.id}>{a.icono} {a.nombre}</option>; })}
          </select>
          <input value={nuevoReporta} onChange={function(e){setNuevoReporta(e.target.value);}} placeholder="Reporta a…" style={{flex:1,minWidth:150,padding:"8px 10px",borderRadius:9,border:"1.5px solid #cbd5e1",fontSize:13}}/>
          <button onClick={crearCargo} style={{padding:"8px 16px",borderRadius:9,border:"none",background:"#8DC63F",color:"#fff",fontWeight:800,cursor:"pointer"}}>Crear</button>
        </div>
        <div style={{fontSize:10.5,color:"#64748b",marginTop:6}}>Se crea sin KPIs; luego agrégalos en 🛠️ Estructura.</div>
      </div>
    </div>
  );
}

  function setAdminPwd(v){ var np=Object.assign({},cfg.passwords||{}); if(v) np.__admin__=v; else delete np.__admin__; props.guardar(Object.assign({},cfg,{passwords:np})); }
  function setHorario(k,v){ var h=Object.assign({inicio:"08:00",fin:"18:00"},cfg.horario||{}); h[k]=v; props.guardar(Object.assign({},cfg,{horario:h})); }
  var hCfg=horarioCfg(cfg);
  var fileRef=useRef(null);
  function exportarConfig(){ var blob=new Blob([JSON.stringify(cfg,null,2)],{type:"application/json"}); var url=URL.createObjectURL(blob); var a=document.createElement("a"); a.href=url; a.download="Respaldo_Bitacora_Contable_"+hoyStr()+".json"; document.body.appendChild(a); a.click(); setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},150); }
  function importarConfig(e){ var f=e.target.files&&e.target.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){ try{ var obj=JSON.parse(r.result); if(!obj.cargos) throw 0; if(confirm("Esto reemplazará TODA la configuración actual (cargos, tareas, pesos, calendario, contraseñas). ¿Continuar?")){ props.guardar(obj); alert("Configuración restaurada."); } }catch(err){ alert("Archivo inválido."); } e.target.value=""; }; r.readAsText(f); }

        <div style={row}><span style={{fontSize:13}}>Umbral de entrada (bono 0 por debajo)</span><input style={inp} type="number" value={cfg.bono.umbralCero} onChange={function(e){setBono("umbralCero",e.target.value);}}/></div>
        <div style={row}><span style={{fontSize:13}}>Meta plena (bono 100% desde)</span><input style={inp} type="number" value={cfg.bono.umbralPleno} onChange={function(e){setBono("umbralPleno",e.target.value);}}/></div>
        <div style={row}><span style={{fontSize:13}}>Tope si hay crítico en rojo (%)</span><input style={inp} type="number" value={cfg.bono.capCritico} onChange={function(e){setBono("capCritico",e.target.value);}}/></div>
        <div style={{fontSize:11,color:"#64748b",marginTop:12,lineHeight:1.4}}>Entre el umbral y la meta plena el bono es <b>proporcional</b>. El descuento por faltas injustificadas se aplica por persona en 💰 Bonificación.</div>
      </div>
      <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:14,padding:16}}>

        <div style={{fontSize:11,color:"#64748b",marginBottom:10,lineHeight:1.4}}>Rango en que los auxiliares pueden marcar sus tareas del día. Fuera de ese horario (o en días pasados) no pueden marcar, y lo no marcado queda como no realizado. El administrador puede corregir cualquier día en ✏️ Corregir.</div>
        <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          <span style={{fontSize:12,color:"#475569",fontWeight:700}}>Desde</span>
          <input type="time" value={hCfg.inicio} onChange={function(e){setHorario("inicio",e.target.value);}} style={{padding:"7px 9px",borderRadius:8,border:"1.5px solid #e2e8f0",fontWeight:700,fontSize:13}}/>
          <span style={{fontSize:12,color:"#475569",fontWeight:700}}>hasta</span>

        <div style={{fontSize:10.5,color:"#64748b",marginTop:8,lineHeight:1.4}}>⚠️ Guarda el <b>código de recuperación</b> en un lugar seguro. Si olvidas la contraseña, con ese código la restableces desde la pantalla de acceso ("¿Olvidaste la contraseña?").</div>
      </div>
      <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:14,padding:16}}>
        <div style={{fontSize:13,fontWeight:800,marginBottom:4}}>💾 Respaldo de configuración</div>
        <div style={{fontSize:11,color:"#64748b",marginBottom:10,lineHeight:1.4}}>Descarga o restaura toda la configuración (cargos, tareas, pesos, calendario, contraseñas). No incluye los registros diarios.</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button onClick={exportarConfig} style={{flex:1,minWidth:140,padding:"9px",borderRadius:9,border:"none",background:"#0ea5e9",color:"#fff",fontWeight:800,cursor:"pointer"}}>⬇️ Exportar respaldo</button>
          <button onClick={function(){fileRef.current&&fileRef.current.click();}} style={{flex:1,minWidth:140,padding:"9px",borderRadius:9,border:"1.5px solid #0ea5e9",background:"#fff",color:"#0369a1",fontWeight:800,cursor:"pointer"}}>⬆️ Importar respaldo</button>
          <input ref={fileRef} type="file" accept="application/json,.json" onChange={importarConfig} style={{display:"none"}}/>
        </div>
      </div>
    </div>
  );
}

// ===================== EXPORTAR EXCEL (formulado) =====================
function exportarExcel(cfg, registros, cierres, ym, areaNombre){
  // En la versión editable, usar el consolidado por KPI con fórmulas vivas.
  if(typeof exportarConsolidado==="function"){ return exportarConsolidado(cfg, registros, cierres, ym, areaNombre); }
  var wb=new ExcelJS.Workbook();
  var colE={ok:"FF16A34A",proc:"FFB45309",pend:"FFB91C1C",na:"FF64748B","":"FF94A3B8"};
  var filE={ok:"FFDCFCE7",proc:"FFFEF9C3",pend:"FFFEE2E2",na:"FFF1F5F9","":"FFF8FAFC"};
  var labE={ok:"Completado",proc:"En proceso",pend:"Pendiente",na:"N/A","":"Sin marcar"};

  // Una hoja por persona (desglose por KPI) + hoja Resumen y Bono
  cfg.cargos.forEach(function(c){
    var nombreHoja=(c.persona||c.cargo).slice(0,28).replace(/[\\\/\?\*\[\]:]/g," ");
    var ws=wb.addWorksheet(nombreHoja);
    ws.addRow([c.cargo.toUpperCase()]); ws.getRow(1).font={bold:true,size:13};
    ws.addRow(["Responsable: "+(c.persona||"(sin asignar)")+"  ·  Reporta a: "+(c.reporta||"")+"  ·  Período: "+nombreMes(ym)]);
    ws.addRow(["Días hábiles del mes:", diasHabiles(ym,c.id,cfg), "Faltas injustificadas:", diasInjustificados(ym,c.id,cfg)]);
    ws.addRow([]);
    var reg=registros[c.id]||{};
    var info=(typeof cumplimientoEditable==="function")?cumplimientoEditable(c,reg,cfg,ym):null;
    if(info && info.kpis.length){
      // Desglose por KPI (mismo criterio que el informe individual y el panel)
      var h=ws.addRow(["KPI","Peso","Resultado","Cumple/Programadas","Estado"]);
      h.font={bold:true}; h.eachCell(function(cell){ cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF334155"}}; cell.font={bold:true,color:{argb:"FFFFFFFF"}}; });
      info.kpis.forEach(function(k){
        var rr=ws.addRow([k.n, k.peso, k.aplica?(k.compl/100):"", k.aplica?(k.cump+" / "+k.prog):"—", k.aplica?(k.compl>=100?"Alcanzado":k.compl>=80?"Parcial":"Bajo"):"No aplica"]);
        rr.getCell(2).numFmt="0%"; rr.getCell(3).numFmt="0%";
      });
      var tot=ws.addRow(["CUMPLIMIENTO DEL MES","", info.pct/100, "", info.normaliza?"(normalizado)":""]);
      tot.font={bold:true}; tot.getCell(3).numFmt="0%"; tot.eachCell(function(cell){ cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFE2E8F0"}}; });
      ws.getColumn(1).width=46; ws.getColumn(2).width=8; ws.getColumn(3).width=11; ws.getColumn(4).width=18; ws.getColumn(5).width=12;
    } else {
      // Sin KPIs (p. ej. Nómina): lista de actividades + cumplimiento real
      var h2=ws.addRow(["Frecuencia","Cód","Tarea / Actividad","Meta","Cumplido","Programadas","% Cumpl."]);
      h2.font={bold:true}; h2.eachCell(function(cell){ cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF334155"}}; cell.font={bold:true,color:{argb:"FFFFFFFF"}}; });
      (c.tareas||[]).forEach(function(t){
        var r=tareaPct(t,reg,ym,cfg,c.id);
        var rr=ws.addRow([t.frec, t.cod, t.nom, t.meta, r.hechos, r.base, ""]);
        rr.getCell(7).value={formula:"IF(F"+rr.number+"=0,0,E"+rr.number+"/F"+rr.number+")"}; rr.getCell(7).numFmt="0%";
      });
      var res2=calcCumplimientoMes(c,reg,ym,cfg);
      var tot2=ws.addRow(["","","CUMPLIMIENTO DEL MES","","","", res2.pct/100]);
      tot2.font={bold:true}; tot2.getCell(7).numFmt="0%"; tot2.getCell(3).alignment={horizontal:"right"}; tot2.eachCell(function(cell){ cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFE2E8F0"}}; });
      ws.getColumn(1).width=12; ws.getColumn(2).width=10; ws.getColumn(3).width=48; ws.getColumn(4).width=12; ws.getColumn(5).width=10; ws.getColumn(6).width=12; ws.getColumn(7).width=10;
    }
  });

  // Hoja Resumen + Bonificación (formulada, enlazada a cada hoja)
  var rs=wb.addWorksheet("📊 Resumen y Bono");
  rs.addRow(["BITÁCORA CONTABLE — RESUMEN Y BONIFICACIÓN"]); rs.getRow(1).font={bold:true,size:14};
  rs.addRow(["ASPM SAS  ·  Período: "+nombreMes(ym)]);
  rs.addRow(["Reglas:","Umbral "+cfg.bono.umbralCero+"%","Meta plena "+cfg.bono.umbralPleno+"%"]);
  rs.addRow(["El bono se calcula con el avance automático del mes (el mismo del informe individual)."]);
  rs.addRow([]);
  var H=rs.addRow(["Cargo","Responsable","Cumplimiento","Bono %","Monto base","Descuento faltas","Bono a liquidar","Estado"]);
  H.font={bold:true}; H.eachCell(function(c){ c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF1A2E0A"}}; c.font={bold:true,color:{argb:"FFFFFFFF"}}; });
  cfg.cargos.forEach(function(c){
    var reg=registros[c.id]||{}; var res=calcCumplimientoMes(c,reg,ym,cfg);
    var ci=(cierres[ym]&&cierres[ym][c.id])||{};
    var cumpl=(ci.cumplimiento!==undefined&&ci.cumplimiento!=="")?Number(ci.cumplimiento):res.pct;
    var bonoPct=calcBono(cumpl,false,cfg.bono);
    var base=(cfg.bono.montoBase&&cfg.bono.montoBase[c.id])||0;
    var diasLab=diasLaboralesMes(ym,cfg);
    var desc=(ci.descuento!==undefined&&ci.descuento!=="")?Number(ci.descuento):(diasLab>0?Math.round(base/diasLab*res.injust):0);
    var sem=colorSemaforo(cumpl,cfg.semaforo);
    var r=rs.addRow([c.cargo, c.persona||"(sin asignar)", cumpl/100, bonoPct/100, base, desc, "", ci.bloqueado?"Cerrado":"Abierto"]);
    var rn=r.number;
    r.getCell(3).numFmt="0%"; r.getCell(4).numFmt="0%"; r.getCell(5).numFmt='"$"#,##0'; r.getCell(6).numFmt='"$"#,##0';
    // Bono a liquidar = Monto base × Bono% − Descuento  (fórmula real y auditable)
    r.getCell(7).value={formula:"MAX(0, E"+rn+"*D"+rn+" - F"+rn+")"}; r.getCell(7).numFmt='"$"#,##0';
    var sc = sem.txt==="Verde"?"FFDCFCE7":sem.txt==="Amarillo"?"FFFEF9C3":"FFFEE2E2";
    r.getCell(3).fill={type:"pattern",pattern:"solid",fgColor:{argb:sc}};
  });
  rs.getColumn(1).width=34; rs.getColumn(2).width=22; [3,4,5,6,7,8].forEach(function(i){rs.getColumn(i).width=15;});

  wb.xlsx.writeBuffer().then(function(buf){
    var blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    var url=URL.createObjectURL(blob); var a=document.createElement("a"); a.href=url; a.download="Bitacora_Contable_"+ym+".xlsx"; document.body.appendChild(a); a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},150);
  });
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
